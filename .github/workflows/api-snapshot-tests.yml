name: API Snapshot Tests

# Characterization suite: boots the dockerized OpenBoxes stack with demo
# data and verifies every API response against the committed snapshots in
# characterization/api/snapshots (see characterization/api/README.md).
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  # Pin the app image to the exact digest the snapshots were recorded
  # against, so upstream image releases can't fail unrelated PRs.
  # Bump this digest (and re-baseline with run.sh --update) intentionally.
  OB_VERSION: "latest@sha256:117b40a462c2a9edc29592ce88b8c659e4241f4779f8d85de8639b9b010fa9e8"

jobs:
  api-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Boot OpenBoxes stack
        working-directory: docker
        run: docker compose up -d

      - name: Wait for app to be healthy
        run: |
          echo "Waiting for OpenBoxes to finish booting (Liquibase migrations run on first boot)..."
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/openboxes/health | grep -q '"UP"'; then
              echo "App is up."
              exit 0
            fi
            sleep 10
          done
          echo "App did not become healthy in time; last logs:"
          docker logs --tail 100 openboxes-app
          exit 1

      - name: Load demo data
        working-directory: docker
        run: ./load-demo-data.sh

      - name: Run API snapshot suite
        run: characterization/api/run.sh

      - name: Dump app logs on failure
        if: failure()
        run: docker logs --tail 300 openboxes-app
