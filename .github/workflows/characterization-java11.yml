name: Characterization (Java 11 build)

# Builds the app from source on JDK 11, packages it into the Java 11 JRE
# Docker image, and runs the Playwright characterization suite (golden-path
# UI flows) against it. This proves behavioral parity of the Java 11 build
# with the recorded baseline.
#
# The API JSON snapshot suite is NOT run here: its snapshots were recorded
# against the pinned released image (see characterization-tests.yml) and
# currently drift from ANY source build of develop (verified identical
# failures on Java 8 and Java 11 source builds), so it only runs against
# the pinned image until the snapshots are re-baselined.
on:
  pull_request:
  push:
    branches: [ 'master', 'develop' ]

concurrency:
  group: characterization-java11-${{ github.ref }}
  cancel-in-progress: true

jobs:
  characterization-java11:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: temurin
          cache: gradle

      - name: Build WAR and Docker context on Java 11
        run: ./gradlew prepareDocker -Dgrails.env=prod --console=plain --no-daemon

      - name: Build Docker image (Java 11 JRE)
        run: docker build -t openboxes/openboxes:java11-ci build/docker

      - name: Boot OpenBoxes stack with the Java 11 image
        working-directory: docker
        run: OB_IMAGE_REPOSITORY="" OB_VERSION=java11-ci docker compose up -d

      - name: Verify container Java version
        run: docker exec openboxes-app java -version

      - name: Wait for app (Liquibase migrations run on first boot)
        working-directory: docker
        run: ./wait-for-app.sh http://localhost:8080/openboxes 1200

      - name: Load demo data
        working-directory: docker
        run: ./load-demo-data.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: characterization/package-lock.json

      - name: Install dependencies
        working-directory: characterization
        run: npm ci

      - name: Install Playwright browsers
        working-directory: characterization
        run: npx playwright install --with-deps chromium

      - name: Run Playwright characterization suite
        working-directory: characterization
        run: npm test

      - name: Upload Playwright report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: characterization-java11-report
          path: |
            characterization/playwright-report/
            characterization/test-results/
            characterization/screenshots/output/
          retention-days: 14

      - name: Dump app logs on failure
        if: failure()
        run: docker logs openboxes-app --tail 300
