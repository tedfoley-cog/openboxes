org.gradle.caching=true
org.gradle.console=plain
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.warning.mode=all

# the version of our application. Grails can't seem to find it in build.gradle
version=0.9.9-SNAPSHOT

# 9.10 is required by Groovy 4 / Spring 6 tooling
asmVersion=9.10
# the asset-pipeline moved to cloud.wondrify for the jakarta-based 5.x line
# (Grails 7 manages 5.0.34 via its BOM)
assetPipelineVersion=5.0.34
batikVersion=1.17
#
# Set this to 1.44 to work with Docker Engine 29 (Nov 2025).
# https://github.com/testcontainers/testcontainers-java/pull/11216
#
dockerApiVersion=1.44
docx4jVersion=8.3.8
flyingSaucerVersion=9.1.22
gradleWrapperVersion=8.14.5
grailsVersion=7.2.1
grailsWrapperVersion=1.0.0
# Grails 7 runs on Apache Groovy 4 (org.apache.groovy)
groovyVersion=4.0.32
htmlUnitVersion=2.70.0
httpComponentsVersion=4.5.14
httpCoreVersion=4.4.16
# managed by Spring Boot 3.5.16 (jackson-bom 2.21.4)
jacksonVersion=2.21.4
jacksonDatabindVersion=2.21.4
# grails-core pulls in 4.2.2 via directory-watcher. This breaks
# Macs, which need 5.8.0+, and testcontainers, which requests 5.13+.
# JNA's only breaking changes between 4.2.2 and today remove APIs
# that directory-watcher does not use.
# https://github.com/java-native-access/jna/blob/master/CHANGES.md#release-580
# https://github.com/java-native-access/jna/blob/master/CHANGES.md#breaking-changes
# https://github.com/java-native-access/jna/blob/master/CHANGES.md#breaking-changes-1
jnaVersion=5.17.0
# the version managed by Spring Boot 3.5.16 (Grails 7.2.1)
logbackVersion=1.5.34
# the version managed by Spring Boot 3.5.16 (Grails 7.2.1)
tomcatVersion=10.1.55
# use the version that Flying-Saucer-PDF was tested and released against
# https://github.com/flyingsaucerproject/flyingsaucer/blob/v9.1.22/flying-saucer-pdf/pom.xml
openPdfVersion=1.3.11
owaspVersion=7.4.4
poiVersion=3.17
# selenium 4 line required by Geb 7 (grails-geb for Grails 7)
seleniumVersion=4.31.0
# Sentry 7.x is the jakarta-servlet / Spring 6 line
sentryVersion=7.22.6
# jakarta.servlet-api 6.1 is the version the Grails 7.2 BOM targets
servletVersion=6.1.0
slf4jProvidedLog4j2Version=2.19.0
# override the Spring Boot BOM so log4j-core (pulled in transitively by
# xdocreport/poi) matches the log4j-api version we provide above
log4j2.version=2.19.0
# slf4j 2.x is required by Spring Boot 3 / logback 1.5
slf4jVersion=2.0.18
springframeworkVersion=6.2.19
testContainersVersion=1.21.3
xDocReportVersion=2.0.4

#
# Grails 7 bundles the database-migration plugin as
# org.apache.grails:grails-data-hibernate5-dbmigration (versioned with
# Grails itself) and manages Liquibase 4.27.0. The legacy 1.9-XSD
# changelogs still parse: the only 1.9-era tag Liquibase 4 rejects is
# modifyColumn, which was *already a silent no-op* under Liquibase
# 3.10.1 (liquibase-core 3.x has no ModifyColumnChange class; the 3.x
# parser dropped the unknown tag and executed those changesets empty).
# util.liquibase.ModifyColumnChange reproduces that exact no-op
# behavior under Liquibase 4.
#
# As for the mysql connector, Liquibase <=3.10.3 required <=8.0.22
# (https://github.com/liquibase/liquibase/issues/1639); Liquibase 4.27
# has no such constraint, so we keep the pinned connector unchanged.
#
# N.B. the 8 here refers to Java's release, not to MySQL's: this
# is the correct library to use to access MySql 5.7+.
#
hibernateVersion=5.6.15.Final
liquibaseVersion=4.27.0
mySqlConnectorVersion=8.0.22

# groovyc needs extra heap to compile the full test suite in one pass
org.gradle.jvmargs=-Xmx2g
