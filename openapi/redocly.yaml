# Redocly CLI lint configuration for the OpenBoxes API specs.
# Run: npx --yes @redocly/cli@1.34.2 lint --config openapi/redocly.yaml 'openapi/specs/*.yaml' openapi/components/common.yaml
extends:
  - recommended
rules:
  # These specs pin CURRENT behavior of a legacy API; no license metadata.
  info-license: off
  # components/common.yaml holds shared components referenced from the
  # per-controller specs, so per-file unused-component analysis is misleading.
  no-unused-components: off
  # Several legacy endpoints legitimately respond only 200 (errors surface
  # as HTML error pages or 200-with-null bodies); don't require 4xx.
  operation-4xx-response: off
  # NoopApiController's actions all throw NotImplementedException, so its
  # operations legitimately respond only 500; don't require a 2xx.
  operation-2xx-response: off
  # The legacy UrlMappings freely mix literal and $id segments under the
  # same prefix (e.g. /api/stocklists/sendMail/$id vs /api/stocklists/$id/export,
  # /api/stockTransfers/candidates vs /api/stockTransfers/$id); Grails resolves
  # them by declaration order, so the "ambiguity" is real, pinned behavior.
  no-ambiguous-paths: off
  # The single documented server IS localhost - the Docker parity baseline
  # from docs/migration/RUNNING_LOCALLY.md.
  no-server-example.com: off
