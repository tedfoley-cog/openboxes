openapi: 3.0.3
info:
  title: OpenBoxes - AdminApiController
  description: >
    Admin endpoints handled by org.pih.warehouse.api.AdminApiController,
    routed via explicit mappings in UrlMappings.groovy
    ("/api/admin/status", "/api/admin/upgrade",
    "/api/admin/upgrade/download", "/api/admin/upgrade/deploy").
    Added in Phase 2 (Batch 41) to back the React admin/status and
    admin/showUpgrade screens. The status endpoint is anonymous for parity
    with the legacy admin/status GSP (the "status" action is whitelisted in
    SecurityInterceptor); the upgrade endpoints require an admin role
    (RoleInterceptor).
  version: 0.1.0
servers:
  - url: http://localhost:8080/openboxes
    description: Local Docker baseline (docs/migration/RUNNING_LOCALLY.md)
security:
  - cookieAuth: []
paths:
  /api/admin/status:
    get:
      operationId: getAdminStatus
      summary: Application status (versions, artefact counts, plugins, controllers)
      security: []
      responses:
        '200':
          description: Application status snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [appVersion, grailsVersion, jvmVersion, controllerCount,
                               domainCount, serviceCount, tagLibCount, plugins, controllers]
                    properties:
                      appVersion:
                        type: string
                        nullable: true
                      grailsVersion:
                        type: string
                        nullable: true
                      jvmVersion:
                        type: string
                      controllerCount:
                        type: integer
                      domainCount:
                        type: integer
                      serviceCount:
                        type: integer
                      tagLibCount:
                        type: integer
                      plugins:
                        type: array
                        items:
                          type: object
                          required: [name]
                          properties:
                            name:
                              type: string
                            version:
                              type: string
                              nullable: true
                      controllers:
                        type: array
                        items:
                          type: object
                          required: [logicalName, className]
                          properties:
                            logicalName:
                              type: string
                            className:
                              type: string
  /api/admin/upgrade:
    get:
      operationId: getAdminUpgrade
      summary: Current upgrade (download/deploy) state from the session
      responses:
        '200':
          description: >
            Upgrade state; all fields are null/0/false when no download has
            been started in this session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpgradeStateResponse'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthorized'
  /api/admin/upgrade/download:
    post:
      operationId: downloadAdminUpgrade
      summary: Start a web archive (WAR) download
      description: >
        Mirrors the legacy AdminController.download action - stores an
        UpgradeCommand in the session pointing at "warehouse.war". Responds
        400 when remoteWebArchiveUrl is missing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                remoteWebArchiveUrl:
                  type: string
      responses:
        '200':
          description: Download initialized.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/UpgradeStateResponse'
                  - type: object
                    properties:
                      message:
                        type: string
        '400':
          $ref: '../components/common.yaml#/components/responses/ValidationError'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthorized'
  /api/admin/upgrade/deploy:
    post:
      operationId: deployAdminUpgrade
      summary: Copy the downloaded web archive to the web container path
      description: >
        Mirrors the legacy AdminController.deploy action. Responds 400 when
        no archive has been downloaded in this session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                localWebArchivePath:
                  type: string
      responses:
        '200':
          description: Archive copied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpgradeStateResponse'
        '400':
          $ref: '../components/common.yaml#/components/responses/ValidationError'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthorized'
components:
  schemas:
    UpgradeStateResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [progressPercentage, downloadCancelled, downloadDone]
          properties:
            remoteWebArchiveUrl:
              type: string
              nullable: true
            remoteFileSize:
              type: integer
              nullable: true
              description: -1 when the remote URL cannot be reached.
            localFileSize:
              type: integer
              nullable: true
            localWebArchivePath:
              type: string
              nullable: true
            localWebArchiveAbsolutePath:
              type: string
              nullable: true
            progressPercentage:
              type: integer
            downloadCancelled:
              type: boolean
            downloadDone:
              type: boolean
  securitySchemes:
    cookieAuth:
      $ref: '../components/common.yaml#/components/securitySchemes/cookieAuth'
