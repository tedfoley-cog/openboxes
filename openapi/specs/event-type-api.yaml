openapi: 3.0.3
info:
  title: OpenBoxes - EventTypeApiController
  description: >
    Event type list/read/create/update/delete endpoints handled by
    org.pih.warehouse.api.EventTypeApiController, routed via the standard
    "/api/${resource}s" and "/api/${resource}s/$id" REST mappings. Added in
    Phase 2 (Batch 42) to back the React eventType create/edit screens.
  version: 0.1.0
servers:
  - url: http://localhost:8080/openboxes
    description: Local Docker baseline (docs/migration/RUNNING_LOCALLY.md)
security:
  - cookieAuth: []
paths:
  /api/eventTypes:
    get:
      operationId: listEventTypes
      summary: List event types
      description: >
        Paged list mirroring the legacy eventType/list screen; max is capped
        at 100 (default 10).
      parameters:
        - name: sort
          in: query
          required: false
          schema:
            type: string
          description: EventType property to sort by (e.g. name, sortOrder).
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
          description: Sort direction, only applied when sort is provided.
        - $ref: '../components/common.yaml#/components/parameters/max'
        - $ref: '../components/common.yaml#/components/parameters/offset'
      responses:
        '200':
          description: Paged event types.
          content:
            application/json:
              schema:
                type: object
                required: [data, totalCount]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventType'
                  totalCount:
                    type: integer
    post:
      operationId: createEventType
      summary: Create an event type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventTypeInput'
      responses:
        '201':
          description: Created event type.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/EventType'
        '400':
          $ref: '../components/common.yaml#/components/responses/ValidationError'
  /api/eventTypes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '../components/common.yaml#/components/schemas/Id'
        description: >
          Event type id. Unknown ids raise ObjectNotFoundException, rendered
          as HTTP 404 by ErrorsController.handleNotFound.
    get:
      operationId: readEventType
      summary: Read a single event type
      responses:
        '200':
          description: The event type.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/EventType'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
    put:
      operationId: updateEventType
      summary: Update an event type
      description: >
        Partial update; only keys present in the body are bound. Also mapped
        for POST via the standard "/api/${resource}s/$id" REST mapping.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventTypeInput'
      responses:
        '200':
          description: The updated event type.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/EventType'
        '400':
          $ref: '../components/common.yaml#/components/responses/ValidationError'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
    delete:
      operationId: deleteEventType
      summary: Delete an event type
      responses:
        '204':
          description: Deleted; no content.
        '400':
          description: >
            Event type is referenced by other records (foreign key
            constraint) and cannot be deleted.
          content:
            application/json:
              schema:
                $ref: '../components/common.yaml#/components/schemas/ErrorResponse'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '500':
          $ref: '../components/common.yaml#/components/responses/ServerError'
components:
  schemas:
    EventType:
      type: object
      description: >
        Event type rendering emitted by EventTypeApiController.toJson().
      required: [id, name, eventCode]
      properties:
        id:
          $ref: '../components/common.yaml#/components/schemas/Id'
        name:
          type: string
        description:
          type: string
          nullable: true
        sortOrder:
          type: integer
          nullable: true
        eventCode:
          $ref: '#/components/schemas/EventCode'
        dateCreated:
          type: string
          nullable: true
        lastUpdated:
          type: string
          nullable: true
      additionalProperties: true
    EventTypeInput:
      type: object
      description: >
        Partial-update input; only keys present are bound. Note that
        system event codes must map to at most one event type
        (EventType.eventCode validator).
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        sortOrder:
          type: integer
          nullable: true
        eventCode:
          $ref: '#/components/schemas/EventCode'
      additionalProperties: true
    EventCode:
      type: string
      enum:
        - CREATED
        - SCHEDULED
        - PICKED
        - PACKED
        - STAGING
        - LOADING
        - SHIPPED
        - IN_TRANSIT
        - CUSTOMS_ENTRY
        - CUSTOMS_HOLD
        - CUSTOMS_RELEASE
        - DELIVERED
        - RECEIVED
        - PARTIALLY_RECEIVED
        - CANCELLED
        - PENDING_APPROVAL
        - APPROVED
        - REJECTED
        - SUBMITTED
        - PUTAWAY
        - PARTIALLY_PUTAWAY
        - CUSTOM
      description: EventCode enum value.
  securitySchemes:
    cookieAuth:
      $ref: '../components/common.yaml#/components/securitySchemes/cookieAuth'
