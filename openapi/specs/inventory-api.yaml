openapi: 3.0.3
info:
  title: OpenBoxes - InventoryApiController
  description: >
    Inventory import and inventory reports handled by
    org.pih.warehouse.api.InventoryApiController, routed via the explicit
    "/api/facilities/$facilityId/inventories/import" (importCsv),
    "/api/facilities/$facilityId/inventories/reorderReport"
    (GET -> getReorderReport), "/api/inventories/expirationHistoryReport"
    (GET -> getExpirationHistoryReport), "/api/inventories/browse"
    (GET -> browse), "/api/inventories/transactionCandidates"
    (GET -> getTransactionCandidates), "/api/inventories/binLocationDetails"
    (GET -> getBinLocationDetails), "/api/inventories/adjustStock"
    (POST -> adjustStock),
    "/api/facilities/$facilityId/inventories/summary"
    (GET -> getInventorySummary),
    "/api/facilities/$facilityId/inventories/expiredStock"
    (GET -> getExpiredStock),
    "/api/facilities/$facilityId/inventories/expiringStock"
    (GET -> getExpiringStock),
    "/api/facilities/$facilityId/inventories/productGroupSummary"
    (GET -> getProductGroupSummary),
    "/api/facilities/$facilityId/inventories/binLocations"
    (GET -> getBinLocations),
    "/api/facilities/$facilityId/inventories/upload"
    (POST -> uploadInventory),
    "/api/inventories/productsWithoutDefaultInventoryItem"
    (GET -> getProductsWithoutDefaultInventoryItem) and
    "/api/inventories/createDefaultInventoryItems"
    (POST -> createDefaultInventoryItems) mappings.
  version: 0.1.0
servers:
  - url: http://localhost:8080/openboxes
    description: Local Docker baseline (docs/migration/RUNNING_LOCALLY.md)
security:
  - cookieAuth: []
paths:
  /api/facilities/{facilityId}/inventories/import:
    post:
      operationId: importInventoryCsv
      summary: Import inventory quantities from a raw CSV body
      description: >
        Reads the raw request body as CSV (not multipart) and applies the
        inventory differences as adjustment transactions for the facility.
        Parity quirks - the mapping declares no HTTP method, so any verb
        routes to importCsv; a successful import responds 200 with an empty
        body; an empty body or a Content-Type other than text/csv raises
        IllegalArgumentException (500).
      parameters:
        - $ref: '#/components/parameters/facilityId'
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              description: >
                CSV with the inventory import columns (product code, lot
                number, expiration date, bin location, quantity, ...).
      responses:
        '200':
          description: Import applied. Empty body.
        '500':
          $ref: '../components/common.yaml#/components/responses/ServerError'
  /api/facilities/{facilityId}/inventories/summary:
    get:
      operationId: getInventorySummary
      summary: Inventory summary rows for the facility (all, low stock or reorder stock)
      description: >
        Backs the React inventory/list, inventory/listLowStock and
        inventory/listReorderStock screens. Returns one row per stocked
        product with quantities, inventory-level thresholds and pricing.
        With status=lowStock only rows below their minimum/reorder levels
        are returned (legacy getLowStock behavior); with status=reorderStock
        only rows at or below their reorder level (legacy getReorderStock
        behavior).
        Parity quirk - if the facilityId cannot be resolved and there is no
        session warehouse the endpoint responds 400 with an errorMessage.
      parameters:
        - $ref: '#/components/parameters/facilityId'
        - name: categories
          in: query
          required: false
          schema:
            type: string
          description: Repeatable category ids to filter by.
        - name: includeSubcategories
          in: query
          required: false
          schema:
            type: boolean
          description: Defaults to true (explode selected categories).
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [lowStock, reorderStock]
          description: >
            lowStock - only rows below minimum/reorder level; reorderStock -
            only rows at or below reorder level.
      responses:
        '200':
          description: Inventory summary rows.
          content:
            application/json:
              schema:
                type: object
                required: [data, totalCount]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/InventorySummaryItem'
                  totalCount:
                    type: integer
        '400':
          description: No location could be resolved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorMessage:
                    type: string
  /api/facilities/{facilityId}/inventories/binLocations:
    get:
      operationId: getBinLocations
      summary: Quantity on hand by bin location for the facility
      description: >
        Backs the React inventory/manage screen. Returns one row per
        product/lot/bin combination with quantity on hand
        (productAvailabilityService.getQuantityOnHandByBinLocation),
        replacing the legacy DataTables aaData rendering of
        inventory/binLocations.
      parameters:
        - $ref: '#/components/parameters/facilityId'
      responses:
        '200':
          description: Bin location rows.
          content:
            application/json:
              schema:
                type: object
                required: [data, totalCount]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BinLocationItem'
                  totalCount:
                    type: integer
        '400':
          description: No location could be resolved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorMessage:
                    type: string
  /api/facilities/{facilityId}/inventories/upload:
    post:
      operationId: uploadInventory
      summary: Parse an uploaded inventory Excel file
      description: >
        Backs the React inventory/upload screen. Accepts a multipart upload
        (field name "file"), parses it with InventoryExcelImporter and
        returns the parsed rows without applying them - matching the legacy
        inventory/upload GSP, which only displayed the parsed file contents.
      parameters:
        - $ref: '#/components/parameters/facilityId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Parsed inventory rows.
          content:
            application/json:
              schema:
                type: object
                required: [data, totalCount]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/InventoryUploadRow'
                  totalCount:
                    type: integer
        '400':
          description: Missing or empty file, or not a multipart request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorMessage:
                    type: string
  /api/inventories/productsWithoutDefaultInventoryItem:
    get:
      operationId: getProductsWithoutDefaultInventoryItem
      summary: Products missing a default (empty lot number) inventory item
      description: >
        Backs the React inventory/showProducts screen
        (inventoryService.findProductsWithoutEmptyLotNumber).
      responses:
        '200':
          description: Products without a default inventory item.
          content:
            application/json:
              schema:
                type: object
                required: [data, totalCount]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        productCode:
                          type: string
                          nullable: true
                        name:
                          type: string
                          nullable: true
                        category:
                          type: string
                          nullable: true
                  totalCount:
                    type: integer
  /api/inventories/createDefaultInventoryItems:
    post:
      operationId: createDefaultInventoryItems
      summary: Create default (empty lot number) inventory items
      description: >
        Creates a blank-lot InventoryItem for every product returned by
        findProductsWithoutEmptyLotNumber, mirroring the legacy
        inventory/createDefaultInventoryItems action. Requires an admin
        (or superuser); returns 403 otherwise.
      responses:
        '200':
          description: Number of inventory items created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      created:
                        type: integer
        '403':
          description: Caller is not an admin.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorMessage:
                    type: string
  /api/facilities/{facilityId}/inventories/productGroupSummary:
    get:
      operationId: getProductGroupSummary
      summary: Quantity on hand by product group with inventory-level status
      description: >
        Backs the React inventoryBrowser/list screen. Wraps
        reportService.calculateQuantityOnHandByProductGroup the same way the
        legacy JsonController.getQuantityOnHandByProductGroup ajax endpoint
        did - the repeatable status parameter selects which status buckets'
        rows are returned (deduplicated as a set). With no status parameter
        the row list is empty. Parity quirk - if the facilityId cannot be
        resolved and there is no session warehouse the endpoint responds 400
        with an errorMessage.
      parameters:
        - $ref: '#/components/parameters/facilityId'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ALL, IN_STOCK, NOT_STOCKED, STOCK_OUT, LOW_STOCK, REORDER, IDEAL_STOCK, OVERSTOCK, INVALID]
          description: Repeatable status buckets to include.
      responses:
        '200':
          description: Product group rows plus status summary and total value.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [rows, totalValue, totalValueFormatted]
                    properties:
                      rows:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                      summary:
                        type: object
                        additionalProperties: true
                      totalValue:
                        type: number
                      totalValueFormatted:
                        type: string
        '400':
          description: No location could be resolved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorMessage:
                    type: string
  /api/facilities/{facilityId}/inventories/expiredStock:
    get:
      operationId: getExpiredStock
      summary: Expired inventory items with quantity on hand
      description: >
        Backs the React inventory/listExpiredStock screen. Returns expired
        inventory items (dashboardService.getExpiredStock) with quantity on
        hand plus the distinct categories present in the result set.
      parameters:
        - $ref: '#/components/parameters/facilityId'
        - name: category.id
          in: query
          required: false
          schema:
            type: string
          description: Category id bound onto the InventoryReportCommand.
        - name: startDate
          in: query
          required: false
          schema:
            type: string
          description: ISO LocalDate bound (yyyy-MM-dd, e.g. "2024-12-31").
        - name: endDate
          in: query
          required: false
          schema:
            type: string
          description: ISO LocalDate bound (yyyy-MM-dd, e.g. "2024-12-31").
      responses:
        '200':
          description: Expired stock rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpirationStockResponse'
        '400':
          description: No location could be resolved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorMessage:
                    type: string
  /api/facilities/{facilityId}/inventories/expiringStock:
    get:
      operationId: getExpiringStock
      summary: Expiring inventory items with quantity on hand
      description: >
        Backs the React inventory/listExpiringStock screen. Returns expiring
        (not yet expired) inventory items (dashboardService.getExpiringStock)
        with quantity on hand plus the distinct categories in the result set.
      parameters:
        - $ref: '#/components/parameters/facilityId'
        - name: category.id
          in: query
          required: false
          schema:
            type: string
          description: Category id bound onto the InventoryReportCommand.
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [within30Days, within90Days, within180Days, within365Days, greaterThan365Days]
          description: Expiration window filter.
        - name: startDate
          in: query
          required: false
          schema:
            type: string
          description: ISO LocalDate bound (yyyy-MM-dd, e.g. "2024-12-31").
        - name: endDate
          in: query
          required: false
          schema:
            type: string
          description: ISO LocalDate bound (yyyy-MM-dd, e.g. "2024-12-31").
      responses:
        '200':
          description: Expiring stock rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpirationStockResponse'
        '400':
          description: No location could be resolved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorMessage:
                    type: string
  /api/facilities/{facilityId}/inventories/reorderReport:
    get:
      operationId: getReorderReport
      summary: Reorder report for products below their reorder levels
      description: >
        Products whose available quantity is at or below the inventory-level
        minimum/reorder quantity. With format=csv the report is returned as a
        text/csv attachment instead of JSON. Parity quirk - the facility is
        taken from the session warehouse plus the additionalLocations filter;
        the facilityId path segment is not bound by the command.
      parameters:
        - $ref: '#/components/parameters/facilityId'
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [csv]
          description: Return the report as a CSV attachment.
        - name: additionalLocations
          in: query
          required: false
          schema:
            type: string
          description: >
            Repeatable ids of additional MANAGE_INVENTORY locations to
            include. A location without that activity fails command
            validation (400).
        - name: inventoryLevelStatus
          in: query
          required: false
          schema:
            type: string
            enum: [ALL_PRODUCTS, BELOW_MINIMUM, BELOW_REORDER]
          description: Defaults to ALL_PRODUCTS.
        - name: expiration
          in: query
          required: false
          schema:
            type: string
            enum: [INCLUDE_EXPIRED_STOCK, SUBTRACT_EXPIRED_STOCK]
          description: Defaults to SUBTRACT_EXPIRED_STOCK.
        - name: categories
          in: query
          required: false
          schema:
            type: string
          description: Repeatable category ids to filter by.
        - name: tags
          in: query
          required: false
          schema:
            type: string
          description: Repeatable tag ids to filter by.
      responses:
        '200':
          description: Reorder report rows (no totalCount is rendered).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReorderReportItem'
            text/csv:
              schema:
                type: string
        '400':
          $ref: '../components/common.yaml#/components/responses/ValidationError'
  /api/inventories/expirationHistoryReport:
    get:
      operationId: getExpirationHistoryReport
      summary: Report of quantity/value lost to expiry over a date range
      description: >
        Expiration history for the session warehouse. With format=csv the
        report is returned as a CSV attachment instead of JSON. Parity
        quirk - the csv branch sets response.contentType before render(),
        which resets it, so the CSV attachment is served with a text/html
        Content-Type header.
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            type: string
          description: >
            Start of the reporting range, bound by Grails date binding
            (e.g. "MM/dd/yyyy HH:mm:ss Z"). Missing dates fail command
            validation (400).
        - name: endDate
          in: query
          required: true
          schema:
            type: string
          description: >
            End of the reporting range, bound by Grails date binding
            (e.g. "MM/dd/yyyy HH:mm:ss Z"). Missing dates fail command
            validation (400).
        - name: searchTerm
          in: query
          required: false
          schema:
            type: string
          description: Filters rows by product name/code.
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [csv]
          description: Return the report as a CSV attachment.
        - name: paginationParams.max
          in: query
          required: false
          schema:
            type: integer
          description: Page size (defaults from PaginationParams).
        - name: paginationParams.offset
          in: query
          required: false
          schema:
            type: integer
          description: Zero-based offset (defaults from PaginationParams).
      responses:
        '200':
          description: Expiration history rows plus report totals.
          content:
            application/json:
              schema:
                type: object
                required: [data, totalCount, totalQuantityLostToExpiry, totalValueLostToExpiry]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      description: >
                        ExpirationHistoryReportRow rendering (product, lot,
                        expiration date, quantity/value lost). The demo
                        dataset has no expired-stock removals, so the exact
                        row shape is not pinned.
                  totalCount:
                    type: integer
                    nullable: true
                  totalQuantityLostToExpiry:
                    type: number
                    nullable: true
                  totalValueLostToExpiry:
                    type: number
                    nullable: true
            text/html:
              schema:
                type: string
                description: >
                  CSV attachment body (mislabelled text/html, see the
                  operation description).
        '400':
          $ref: '../components/common.yaml#/components/responses/ValidationError'
  /api/inventories/browse:
    get:
      operationId: browseInventory
      summary: Paginated product search with quantity on hand
      description: >
        Backs the React inventory browser (migrated from the legacy
        inventory/browse GSP). Searches active products for the given (or
        session) location and returns quantity on hand per product.
      parameters:
        - name: locationId
          in: query
          required: false
          schema:
            $ref: '../components/common.yaml#/components/schemas/Id'
          description: Defaults to the session warehouse.
        - name: searchTerms
          in: query
          required: false
          schema:
            type: string
          description: Space-separated product search terms.
        - name: categoryId
          in: query
          required: false
          schema:
            $ref: '../components/common.yaml#/components/schemas/Id'
          description: Category id filter (defaults to the root category).
        - name: tags
          in: query
          required: false
          schema:
            type: string
          description: Repeatable tag ids to filter by.
        - name: catalogs
          in: query
          required: false
          schema:
            type: string
          description: Repeatable product catalog ids to filter by.
        - $ref: '../components/common.yaml#/components/parameters/max'
        - $ref: '../components/common.yaml#/components/parameters/offset'
      responses:
        '200':
          description: One page of product rows plus the total match count.
          content:
            application/json:
              schema:
                type: object
                required: [data, totalCount]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BrowseProduct'
                  totalCount:
                    type: integer
  /api/inventories/transactionCandidates:
    get:
      operationId: getTransactionCandidates
      summary: Per-bin inventory item rows for selected products
      description: >
        Backs the React record-transaction screen (migrated from the legacy
        inventory/createTransaction GSP). Returns one row per product/bin
        location/inventory item combination with quantity on hand.
      parameters:
        - name: locationId
          in: query
          required: false
          schema:
            $ref: '../components/common.yaml#/components/schemas/Id'
          description: Defaults to the session warehouse.
        - name: transactionTypeId
          in: query
          required: false
          schema:
            type: string
          description: Transaction type id (echoed back in the response).
        - name: product.id
          in: query
          required: false
          schema:
            type: string
          description: >
            Repeatable product ids. At least one product.id or
            inventoryItem.id is required; omitting both raises
            IllegalArgumentException (500).
        - name: inventoryItem.id
          in: query
          required: false
          schema:
            type: string
          description: >
            Repeatable inventory item ids, used by the legacy
            expiring/expired stock lists. Only consulted when no
            product.id values are supplied.
      responses:
        '200':
          description: Candidate rows plus the resolved transaction type.
          content:
            application/json:
              schema:
                type: object
                required: [data, totalCount]
                properties:
                  transactionType:
                    type: object
                    nullable: true
                    properties:
                      id:
                        type: string
                        nullable: true
                      name:
                        type: string
                        nullable: true
                      transactionCode:
                        type: string
                        nullable: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TransactionCandidate'
                  totalCount:
                    type: integer
        '500':
          $ref: '../components/common.yaml#/components/responses/ServerError'
  /api/inventories/binLocationDetails:
    get:
      operationId: getBinLocationDetails
      summary: Details for a single product/bin location/lot pairing
      description: >
        Backs the React adjust-stock screen (migrated from the legacy
        inventory/editBinLocation GSP dialog). Resolves the product by code,
        the bin location by name within the location, and the inventory item
        by lot number.
      parameters:
        - name: locationId
          in: query
          required: false
          schema:
            $ref: '../components/common.yaml#/components/schemas/Id'
          description: Defaults to the session warehouse.
        - name: productCode
          in: query
          required: false
          schema:
            type: string
          description: Product code (e.g. "10001").
        - name: binLocation
          in: query
          required: false
          schema:
            type: string
          description: Bin location name within the location.
        - name: lotNumber
          in: query
          required: false
          schema:
            type: string
          description: Lot number (empty for the default lot).
      responses:
        '200':
          description: Resolved references and the current quantity on hand.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [location, quantityOnHand]
                    properties:
                      location:
                        type: object
                        nullable: true
                        additionalProperties: true
                      binLocation:
                        type: object
                        nullable: true
                        additionalProperties: true
                      product:
                        type: object
                        nullable: true
                        additionalProperties: true
                      inventoryItem:
                        type: object
                        nullable: true
                        additionalProperties: true
                      quantityOnHand:
                        type: integer
  /api/inventories/adjustStock:
    post:
      operationId: adjustStock
      summary: Adjust the stock level of one inventory item / bin location
      description: >
        Backs the React adjust-stock screen (migrated from the legacy
        inventoryItem/adjustStock action). Creates an adjustment transaction
        that sets the quantity on hand to newQuantity. Validation failures
        (unchanged quantity, missing reason code/comment, another transaction
        at the same instant) respond 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inventoryItemId, newQuantity]
              properties:
                locationId:
                  type: string
                  nullable: true
                  description: Defaults to the session warehouse.
                inventoryItemId:
                  type: string
                binLocationId:
                  type: string
                  nullable: true
                currentQuantity:
                  type: integer
                  nullable: true
                newQuantity:
                  type: integer
                reasonCode:
                  type: string
                  nullable: true
                  description: ReasonCode enum name (e.g. DAMAGED_PRODUCT).
                comment:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Adjustment applied.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      inventoryItemId:
                        type: string
                        nullable: true
                      productId:
                        type: string
                        nullable: true
                      newQuantity:
                        type: integer
                        nullable: true
        '400':
          $ref: '../components/common.yaml#/components/responses/ValidationError'
components:
  securitySchemes:
    cookieAuth:
      $ref: '../components/common.yaml#/components/securitySchemes/cookieAuth'
  parameters:
    facilityId:
      name: facilityId
      in: path
      required: true
      schema:
        $ref: '../components/common.yaml#/components/schemas/Id'
      description: Facility (warehouse) id.
  schemas:
    BinLocationItem:
      type: object
      properties:
        product:
          type: object
          properties:
            id:
              type: string
              nullable: true
            productCode:
              type: string
              nullable: true
            name:
              type: string
              nullable: true
        inventoryItem:
          type: object
          properties:
            id:
              type: string
              nullable: true
            lotNumber:
              type: string
              nullable: true
            expirationDate:
              type: string
              nullable: true
              description: yyyy-MM-dd
        binLocation:
          type: object
          nullable: true
          properties:
            id:
              type: string
            name:
              type: string
              nullable: true
        quantityOnHand:
          type: number
          nullable: true
    InventoryUploadRow:
      type: object
      description: One parsed row from the uploaded inventory Excel file.
      properties:
        productCode:
          type: string
          nullable: true
        product:
          type: string
          nullable: true
        lotNumber:
          type: string
          nullable: true
        expirationDate:
          type: string
          nullable: true
          description: yyyy-MM-dd
        binLocation:
          type: string
          nullable: true
        quantityOnHand:
          type: number
          nullable: true
        quantity:
          type: number
          nullable: true
        comments:
          type: string
          nullable: true
    BrowseProduct:
      type: object
      description: One inventory browser row (product plus quantity on hand).
      required: [id, productCode, name, quantityOnHand]
      properties:
        id:
