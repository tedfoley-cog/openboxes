openapi: 3.0.3
info:
  title: OpenBoxes - InventoryLevelApiController
  description: >
    Facility inventory-level listing handled by
    org.pih.warehouse.api.InventoryLevelApiController, routed via the
    explicit "/api/facilities/$facilityId/inventory-levels(.$format)?"
    mapping (GET -> list) and the
    "/api/facilities/$facilityId/products/$productId/inventoryLevel" mapping
    (GET -> read, PUT -> update) backing the React "Edit Inventory Level"
    screen. The optional .csv / .xls extension on the list switches the
    response to a CSV or Excel attachment.
  version: 0.1.0
servers:
  - url: http://localhost:8080/openboxes
    description: Local Docker baseline (docs/migration/RUNNING_LOCALLY.md)
security:
  - cookieAuth: []
paths:
  /api/facilities/{facilityId}/products/{productId}/inventoryLevel:
    get:
      operationId: readInventoryLevel
      summary: Facility-level inventory level (status) of a product
      description: >
        Mirrors the legacy InventoryItemController.editInventoryLevel lookup.
        When the product has no inventory level yet, id and status are null
        (the screen then creates one on save). Parity quirk - unknown
        facility or product ids raise IllegalArgumentException (500).
      parameters:
        - $ref: '#/components/parameters/facilityId'
        - $ref: '#/components/parameters/productId'
      responses:
        '200':
          description: The product's inventory level at the facility.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [product, inventory]
                    properties:
                      id:
                        type: string
                        nullable: true
                      status:
                        type: string
                        nullable: true
                        enum: [INACTIVE, NOT_SUPPORTED, SUPPORTED_NON_INVENTORY, SUPPORTED, STOCK, FORMULARY, null]
                      product:
                        type: object
                        additionalProperties: true
                      inventory:
                        type: object
                        additionalProperties: true
        '500':
          $ref: '../components/common.yaml#/components/responses/ServerError'
    put:
      operationId: updateInventoryLevel
      summary: Create or update the product's facility-level inventory level status
      description: >
        Mirrors the legacy InventoryItemController.updateInventoryLevel form,
        which only edits the status field. Creates the inventory level if it
        does not exist yet. A null/empty status clears the field.
      parameters:
        - $ref: '#/components/parameters/facilityId'
        - $ref: '#/components/parameters/productId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  nullable: true
                  enum: [INACTIVE, NOT_SUPPORTED, SUPPORTED_NON_INVENTORY, SUPPORTED, STOCK, FORMULARY, null]
      responses:
        '200':
          description: The saved inventory level.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      status:
                        type: string
                        nullable: true
                      product:
                        type: object
                        additionalProperties: true
        '400':
          description: Validation failure.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorMessages:
                    type: array
                    items:
                      type: string
        '500':
          $ref: '../components/common.yaml#/components/responses/ServerError'
  /api/facilities/{facilityId}/inventory-levels:
    get:
      operationId: listInventoryLevels
      summary: List facility-wide inventory levels
      description: >
        Inventory levels of the facility's inventory with no internal
        location (facility-wide levels only). Parity quirks - an unknown
        facility id raises IllegalArgumentException (500); the JSON items are
        the default Grails InventoryLevel rendering.
      parameters:
        - name: facilityId
          in: path
          required: true
          schema:
            $ref: '../components/common.yaml#/components/schemas/Id'
          description: Facility (warehouse) id.
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [csv, xls]
          description: >
            Also selectable via the .csv/.xls URL extension. csv returns a
            text/csv attachment. Parity quirk - the xls branch streams an
            Excel workbook directly to the output stream without setting a
            Content-Type header (and its Content-Disposition header is set
            too late to take effect), so the xls response cannot be described
            with an OpenAPI media type and is not validated by the contract
            tests.
      responses:
        '200':
          description: Inventory levels of the facility.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/InventoryLevel'
            text/csv:
              schema:
                type: string
        '500':
          $ref: '../components/common.yaml#/components/responses/ServerError'
  /api/inventoryLevels:
    get:
      operationId: searchInventoryLevels
      summary: Paged inventory level search (React inventoryLevel/list screen)
      description: >
        Mirrors the legacy InventoryLevelController.list criteria - optional
        product search terms (q) and facility filter (locationId). Parity
        quirk - when q matches no products the product filter is dropped and
        all levels are returned. format=csv exports all matching rows as a
        text/csv attachment.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Product search terms (space separated).
        - name: locationId
          in: query
          required: false
          schema:
            $ref: '../components/common.yaml#/components/schemas/Id'
          description: Facility (warehouse) id whose inventory to filter by.
        - name: max
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            default: 10
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: sort
          in: query
          required: false
          schema:
            type: string
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [csv]
      responses:
        '200':
          description: Page of inventory levels.
          content:
            application/json:
              schema:
                type: object
                required: [data, totalCount]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/InventoryLevelListItem'
                  totalCount:
                    type: integer
            text/csv:
              schema:
                type: string
        '500':
          $ref: '../components/common.yaml#/components/responses/ServerError'
    post:
      operationId: createInventoryLevel
      summary: Create an inventory level (React inventoryLevel/create screen)
      description: >
        Mirrors the legacy InventoryLevelController.save duplicate check on
        (product, inventory, internalLocation) - duplicates are rejected with
        400. Parity quirk - returns 200 (not 201) on create.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryLevelWrite'
      responses:
        '200':
          description: The created inventory level.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryLevelDetailResponse'
        '400':
          $ref: '#/components/responses/InventoryLevelError'
        '500':
          $ref: '../components/common.yaml#/components/responses/ServerError'
  /api/inventoryLevels/{id}:
    get:
      operationId: getInventoryLevelById
      summary: Inventory level detail (React inventoryLevel/show and edit screens)
      parameters:
        - $ref: '#/components/parameters/inventoryLevelId'
      responses:
        '200':
          description: The inventory level.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryLevelDetailResponse'
        '404':
          $ref: '#/components/responses/InventoryLevelError'
        '500':
          $ref: '../components/common.yaml#/components/responses/ServerError'
    put:
      operationId: updateInventoryLevelById
      summary: Update an inventory level (React inventoryLevel/edit screen)
      description: >
        Mirrors the legacy InventoryLevelController.update optimistic locking
        check - a stale version in the body is rejected with 400.
      parameters:
        - $ref: '#/components/parameters/inventoryLevelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryLevelWrite'
      responses:
        '200':
          description: The updated inventory level.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryLevelDetailResponse'
        '400':
          $ref: '#/components/responses/InventoryLevelError'
        '404':
          $ref: '#/components/responses/InventoryLevelError'
        '500':
          $ref: '../components/common.yaml#/components/responses/ServerError'
    delete:
      operationId: deleteInventoryLevelById
      summary: Delete an inventory level (React inventoryLevel/show screen)
      parameters:
        - $ref: '#/components/parameters/inventoryLevelId'
      responses:
        '200':
          description: Deletion confirmation.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      deleted:
                        type: boolean
        '400':
          $ref: '#/components/responses/InventoryLevelError'
        '404':
          $ref: '#/components/responses/InventoryLevelError'
        '500':
          $ref: '../components/common.yaml#/components/responses/ServerError'
components:
  parameters:
    facilityId:
      name: facilityId
      in: path
      required: true
      schema:
        $ref: '../components/common.yaml#/components/schemas/Id'
      description: Facility (warehouse) id.
    productId:
      name: productId
      in: path
      required: true
      schema:
        $ref: '../components/common.yaml#/components/schemas/Id'
      description: Product id.
    inventoryLevelId:
      name: id
      in: path
      required: true
      schema:
        $ref: '../components/common.yaml#/components/schemas/Id'
      description: Inventory level id.
  responses:
    InventoryLevelError:
      description: Error message.
      content:
        application/json:
          schema:
            type: object
            properties:
              errorMessage:
                type: string
              errorMessages:
                type: array
                items:
                  type: string
  securitySchemes:
    cookieAuth:
      $ref: '../components/common.yaml#/components/securitySchemes/cookieAuth'
  schemas:
    InventoryLevel:
      type: object
      description: >
        Default Grails JSON rendering of
        org.pih.warehouse.inventory.InventoryLevel. Associations (inventory,
        product, preferredBinLocation, ...) are rendered as shallow {"id"}
        references.
      properties:
        id:
          $ref: '../components/common.yaml#/components/schemas/Id'
        inventory:
          type: object
          nullable: true
          additionalProperties: true
        product:
          type: object
          nullable: true
          additionalProperties: true
        internalLocation:
          type: object
          nullable: true
          additionalProperties: true
        binLocation:
          type: object
          nullable: true
          additionalProperties: true
        preferredBinLocation:
          type: object
          nullable: true
          additionalProperties: true
        replenishmentLocation:
          type: object
          nullable: true
          additionalProperties: true
        preferred:
          type: boolean
          nullable: true
        abcClass:
          type: string
          nullable: true
        status:
          description: >
            Default Grails JSON rendering of the InventoryStatus enum - an
            object like {"enumType": "...InventoryStatus", "name": "STOCK"}.
          type: object
          nullable: true
          additionalProperties: true
        comments:
          type: string
          nullable: true
        minQuantity:
          type: number
          nullable: true
        maxQuantity:
          type: number
          nullable: true
        reorderQuantity:
          type: number
          nullable: true
        forecastQuantity:
          type: number
          nullable: true
        forecastPeriodDays:
          type: number
          nullable: true
        demandTimePeriodDays:
          type: number
          nullable: true
        expectedLeadTimeDays:
          type: number
          nullable: true
        replenishmentPeriodDays:
          type: number
          nullable: true
        dateCreated:
          type: string
          nullable: true
        lastUpdated:
          type: string
          nullable: true
      additionalProperties: true
    NamedReference:
      type: object
      nullable: true
      properties:
        id:
          $ref: '../components/common.yaml#/components/schemas/Id'
        name:
          type: string
          nullable: true
    InventoryLevelListItem:
      type: object
      required: [id, product, inventory]
      properties:
        id:
          $ref: '../components/common.yaml#/components/schemas/Id'
        status:
          type: string
          nullable: true
        product:
          type: object
          properties:
            id:
              $ref: '../components/common.yaml#/components/schemas/Id'
            productCode:
              type: string
              nullable: true
            name:
              type: string
              nullable: true
        inventory:
          type: object
          properties:
            id:
              $ref: '../components/common.yaml#/components/schemas/Id'
            warehouse:
              type: string
              nullable: true
        minQuantity:
          type: number
          nullable: true
        reorderQuantity:
          type: number
          nullable: true
        maxQuantity:
          type: number
          nullable: true
        dateCreated:
          type: string
          nullable: true
    InventoryLevelDetail:
      allOf:
        - $ref: '#/components/schemas/InventoryLevelListItem'
        - type: object
          properties:
            version:
              type: integer
              nullable: true
            facility:
              $ref: '#/components/schemas/NamedReference'
            supported:
              type: boolean
              nullable: true
            internalLocation:
              $ref: '#/components/schemas/NamedReference'
            preferredBinLocation:
              $ref: '#/components/schemas/NamedReference'
            replenishmentLocation:
              $ref: '#/components/schemas/NamedReference'
            abcClass:
              type: string
              nullable: true
            comments:
              type: string
              nullable: true
            forecastQuantity:
              type: number
              nullable: true
            forecastPeriodDays:
              type: number
              nullable: true
            expectedLeadTimeDays:
              type: number
              nullable: true
            replenishmentPeriodDays:
              type: number
              nullable: true
            lastUpdated:
              type: string
              nullable: true
    InventoryLevelDetailResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/InventoryLevelDetail'
    InventoryLevelWrite:
      type: object
      description: >
        Only keys present in the body are bound (partial update semantics).
        product and location are only honored on create; version enables the
        optimistic locking check on update.
      properties:
        product:
          $ref: '#/components/schemas/NamedReference'
        location:
          $ref: '#/components/schemas/NamedReference'
        internalLocation:
          $ref: '#/components/schemas/NamedReference'
        preferredBinLocation:
          $ref: '#/components/schemas/NamedReference'
        replenishmentLocation:
          $ref: '#/components/schemas/NamedReference'
        status:
          type: string
          nullable: true
        abcClass:
          type: string
          nullable: true
        comments:
          type: string
          nullable: true
        minQuantity:
          type: number
          nullable: true
        reorderQuantity:
          type: number
          nullable: true
        maxQuantity:
          type: number
          nullable: true
        forecastQuantity:
          type: number
          nullable: true
        forecastPeriodDays:
          type: number
          nullable: true
        expectedLeadTimeDays:
          type: number
          nullable: true
        replenishmentPeriodDays:
          type: number
          nullable: true
        version:
          type: integer
          nullable: true
