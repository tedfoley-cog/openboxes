openapi: 3.0.3
info:
  title: OpenBoxes - JobsApiController
  description: >
    Quartz scheduler read/schedule endpoints handled by
    org.pih.warehouse.api.JobsApiController, routed via the explicit
    "/api/jobs/details" and "/api/jobs/triggers" mappings. Added in
    Phase 2 (Batch 43) to back the React jobs/show screen. Quartz job
    names are fully-qualified class names (they contain dots), so job and
    trigger identifiers are passed as query parameters / JSON body values
    instead of path segments. Note: the legacy jobs/scheduleJob action was
    broken (it never built a trigger); createTrigger implements the
    intended cron scheduling behavior.
  version: 0.1.0
servers:
  - url: http://localhost:8080/openboxes
    description: Local Docker baseline (docs/migration/RUNNING_LOCALLY.md)
security:
  - cookieAuth: []
paths:
  /api/jobs/list:
    get:
      operationId: listJobs
      summary: List all Quartz jobs with their triggers and scheduler state
      responses:
        '200':
          description: All registered Quartz jobs, sorted by name.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [schedulerInStandbyMode, jobs]
                    properties:
                      schedulerInStandbyMode:
                        type: boolean
                      jobs:
                        type: array
                        items:
                          $ref: '#/components/schemas/JobDetail'
  /api/jobs/pause:
    post:
      operationId: pauseJob
      summary: Pause all triggers of a Quartz job
      requestBody:
        $ref: '#/components/requestBodies/JobActionRequest'
      responses:
        '200':
          $ref: '#/components/responses/JobDetailResponse'
        '404':
          $ref: '#/components/responses/JobNotFound'
  /api/jobs/resume:
    post:
      operationId: resumeJob
      summary: Resume all triggers of a paused Quartz job
      requestBody:
        $ref: '#/components/requestBodies/JobActionRequest'
      responses:
        '200':
          $ref: '#/components/responses/JobDetailResponse'
        '404':
          $ref: '#/components/responses/JobNotFound'
  /api/jobs/run:
    post:
      operationId: runJobNow
      summary: Trigger an immediate one-off execution of a Quartz job
      requestBody:
        $ref: '#/components/requestBodies/JobActionRequest'
      responses:
        '200':
          $ref: '#/components/responses/JobDetailResponse'
        '404':
          $ref: '#/components/responses/JobNotFound'
  /api/jobs/scheduler/standby:
    post:
      operationId: standbyScheduler
      summary: Put the Quartz scheduler into standby mode
      responses:
        '200':
          $ref: '#/components/responses/SchedulerStateResponse'
  /api/jobs/scheduler/start:
    post:
      operationId: startScheduler
      summary: Start the Quartz scheduler (leave standby mode)
      responses:
        '200':
          $ref: '#/components/responses/SchedulerStateResponse'
  /api/jobs/details:
    get:
      operationId: readJobDetails
      summary: Read a Quartz job's detail and triggers
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: Quartz job name (fully-qualified job class name).
        - name: group
          in: query
          required: false
          schema:
            type: string
          description: Quartz job group; defaults to GRAILS_JOBS.
      responses:
        '200':
          description: The job detail and its triggers.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/JobDetail'
        '400':
          description: Missing job name.
          content:
            application/json:
              schema:
                $ref: '../components/common.yaml#/components/schemas/ErrorResponse'
        '404':
          description: No job detail for the given key.
          content:
            application/json:
              schema:
                $ref: '../components/common.yaml#/components/schemas/ErrorResponse'
  /api/jobs/triggers:
    post:
      operationId: createJobTrigger
      summary: Schedule a cron trigger for a Quartz job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jobName, cronExpression]
              properties:
                jobName:
                  type: string
                jobGroup:
                  type: string
                  description: Defaults to GRAILS_JOBS.
                cronExpression:
                  type: string
                  description: Quartz cron expression, e.g. "0 0 22 * * ?".
      responses:
        '201':
          description: Trigger scheduled; returns the refreshed job detail.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/JobDetail'
        '400':
          description: Invalid cron expression.
          content:
            application/json:
              schema:
                $ref: '../components/common.yaml#/components/schemas/ValidationErrorResponse'
        '404':
          description: No job detail for the given key.
          content:
            application/json:
              schema:
                $ref: '../components/common.yaml#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteJobTrigger
      summary: Unschedule a Quartz trigger
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: Quartz trigger name.
        - name: group
          in: query
          required: false
          schema:
            type: string
          description: Quartz trigger group; defaults to GRAILS_JOBS.
      responses:
        '204':
          description: Unscheduled; no content.
        '404':
          description: No trigger for the given key.
          content:
            application/json:
              schema:
                $ref: '../components/common.yaml#/components/schemas/ErrorResponse'
components:
  requestBodies:
    JobActionRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [jobName]
            properties:
              jobName:
                type: string
              jobGroup:
                type: string
                description: Defaults to GRAILS_JOBS.
  responses:
    JobDetailResponse:
      description: The refreshed job detail.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/JobDetail'
    JobNotFound:
      description: No job detail for the given key.
      content:
        application/json:
          schema:
            $ref: '../components/common.yaml#/components/schemas/ErrorResponse'
    SchedulerStateResponse:
      description: The scheduler standby state after the operation.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [schedulerInStandbyMode]
                properties:
                  schedulerInStandbyMode:
                    type: boolean
  schemas:
    JobDetail:
      type: object
      description: Job detail rendering emitted by JobsApiController.toJson().
      required: [name, group, key, triggers]
      properties:
        name:
          type: string
        group:
          type: string
        key:
          type: string
          description: Quartz JobKey toString ("group.name").
        description:
          type: string
          nullable: true
        jobClass:
          type: string
          nullable: true
        durable:
          type: boolean
        concurrentExecutionDisallowed:
          type: boolean
        persistJobDataAfterExecution:
          type: boolean
        requestsRecovery:
          type: boolean
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/Trigger'
      additionalProperties: true
    Trigger:
      type: object
      description: Trigger rendering emitted by JobsApiController.toTriggerJson().
      required: [name, group, key]
      properties:
        name:
          type: string
        group:
          type: string
        key:
          type: string
          description: Quartz TriggerKey toString ("group.name").
        cronExpression:
          type: string
          nullable: true
          description: Present for cron triggers only.
        expressionSummary:
          type: string
          nullable: true
          description: Present for cron triggers only.
        previousFireTime:
          type: string
          nullable: true
        nextFireTime:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
          description: Trigger state name (e.g. NORMAL, PAUSED); only in listJobs.
      additionalProperties: true
  securitySchemes:
    cookieAuth:
      $ref: '../components/common.yaml#/components/securitySchemes/cookieAuth'
