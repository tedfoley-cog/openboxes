openapi: 3.0.3
info:
  title: OpenBoxes - MigrationApiController
  description: >
    Endpoints for the migration admin dashboard handled by
    org.pih.warehouse.api.MigrationApiController, explicitly mapped under
    /api/migration/*. Added in Phase 2 (Batch 44) for the migrated
    migration/dataMigration, migration/dataQuality, migration/dimensionTables
    and migration/factTables screens, and extended in Batch 45 with the
    materialized-view and product-availability endpoints backing the React
    migration/materializedViews and migration/productAvailability screens.
    The counts mirror the models the legacy GSP screens rendered;
    dataMigration reflects the session's current location.
  version: 0.1.0
servers:
  - url: http://localhost:8080/openboxes
    description: Local Docker baseline (docs/migration/RUNNING_LOCALLY.md)
security:
  - cookieAuth: []
paths:
  /api/migration/dataMigration:
    get:
      operationId: getDataMigration
      summary: Data migration counts for the current location
      responses:
        '200':
          description: Counts and details shown on the Data Migration tab.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required:
                      - organizationCount
                      - productSupplierCount
                      - inventoryTransactionCount
                      - productInventoryTransactionCount
                      - productInventoryTransactionInCurrentLocationCount
                      - productsWithProductInventoryTransactionInCurrentLocation
                      - overlappingTransactions
                      - amountOfMissingInventoryImportTransactionSources
                      - amountOfMissingCycleCountTransactionSources
                    properties:
                      organizationCount:
                        type: integer
                        description: Suppliers eligible for organization migration.
                      productSupplierCount:
                        type: integer
                        description: Products eligible for product supplier migration.
                      inventoryTransactionCount:
                        type: integer
                      productInventoryTransactionCount:
                        type: integer
                      productInventoryTransactionInCurrentLocationCount:
                        type: integer
                      productsWithProductInventoryTransactionInCurrentLocation:
                        type: array
                        description: Product codes with deprecated product inventory transactions in the current location.
                        items:
                          type: string
                          nullable: true
                      overlappingTransactions:
                        type: object
                        description: Product code -> overlapping transaction descriptions.
                        additionalProperties:
                          type: array
                          items:
                            type: string
                      amountOfMissingInventoryImportTransactionSources:
                        type: integer
                      amountOfMissingCycleCountTransactionSources:
                        type: integer
                      amountOfMissingRecordStockTransactionSources:
                        type: integer
                        nullable: true
                        description: Null until the inventory import and cycle count migrations are complete.
  /api/migration/dataQuality:
    get:
      operationId: getDataQuality
      summary: Data quality indicator counts
      responses:
        '200':
          description: Counts shown on the Data Quality tab.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required:
                      - receiptsWithoutTransactionCount
                      - shipmentsWithoutTransactionsCount
                      - stockMovementsWithoutShipmentItemsCount
                    properties:
                      receiptsWithoutTransactionCount:
                        type: integer
                      shipmentsWithoutTransactionsCount:
                        type: integer
                      stockMovementsWithoutShipmentItemsCount:
                        type: integer
  /api/migration/receiptsWithoutTransaction:
    get:
      operationId: listReceiptsWithoutTransaction
      summary: Receipts that have been received without an inbound transaction
      responses:
        '200':
          description: Receipts without transactions, sorted by shipment number.
          content:
            application/json:
              schema:
                type: object
                required: [data, totalCount]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        shipmentId:
                          type: string
                          nullable: true
                        shipmentNumber:
                          type: string
                          nullable: true
                        shipmentStatus:
                          type: string
                          nullable: true
                        shipmentName:
                          type: string
                          nullable: true
                        receiptNumber:
                          type: string
                          nullable: true
                        receiptStatus:
                          type: string
                          nullable: true
                  totalCount:
                    type: integer
  /api/migration/shipmentsWithoutTransactions:
    get:
      operationId: listShipmentsWithoutTransactions
      summary: Shipped shipments without an outbound transaction
      responses:
        '200':
          description: Shipments without transactions.
          content:
            application/json:
              schema:
                type: object
                required: [data, totalCount]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        shipmentId:
                          type: string
                          nullable: true
                        shipmentNumber:
                          type: string
                          nullable: true
                        shipmentStatus:
                          type: string
                          nullable: true
                        origin:
                          type: string
                          nullable: true
                        destination:
                          type: string
                          nullable: true
                  totalCount:
                    type: integer
  /api/migration/stockMovementsWithoutShipmentItems:
    get:
      operationId: listStockMovementsWithoutShipmentItems
      summary: Issued stock movements without shipment items
      responses:
        '200':
          description: Stock movements without shipment items, sorted by date created.
          content:
            application/json:
              schema:
                type: object
                required: [data, totalCount]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          nullable: true
                        identifier:
                          type: string
                          nullable: true
                        status:
                          type: string
                          nullable: true
                        dateCreated:
                          type: string
                          nullable: true
                        origin:
                          type: string
                          nullable: true
                        requested:
                          type: string
                          nullable: true
                        picked:
                          type: string
                          nullable: true
                        shipped:
                          type: string
                          nullable: true
                        issued:
                          type: string
                          nullable: true
                  totalCount:
                    type: integer
  /api/migration/dimensionTables:
    get:
      operationId: getDimensionTables
      summary: Reporting dimension table counts
      responses:
        '200':
          description: Counts shown on the Dimensions tab.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required:
                      - dateDimensionCount
                      - locationDimensionCount
                      - lotDimensionCount
                      - productDimensionCount
                    properties:
                      dateDimensionCount:
                        type: integer
                      locationDimensionCount:
                        type: integer
                      lotDimensionCount:
                        type: integer
                      productDimensionCount:
                        type: integer
  /api/migration/factTables:
    get:
      operationId: getFactTables
      summary: Reporting fact table counts
      responses:
        '200':
          description: Counts shown on the Facts tab.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required:
                      - transactionFactCount
                      - consumptionFactCount
                      - stockoutFactCount
                    properties:
                      transactionFactCount:
                        type: integer
                      consumptionFactCount:
                        type: integer
                      stockoutFactCount:
                        type: integer
  /api/migration/materializedViews:
    get:
      operationId: readMaterializedViewCounts
      summary: Read row counts of the materialized-view tables
      responses:
        '200':
          description: Row counts for product demand and product availability.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [productDemandCount, productAvailabilityCount]
                    properties:
                      productDemandCount:
                        type: integer
                      productAvailabilityCount:
                        type: integer
  /api/migration/productAvailability:
    get:
      operationId: listProductAvailabilityByDepot
      summary: List product availability row counts per depot location
      responses:
        '200':
          description: >
            One row per depot, in depot order (matching the legacy screen).
            Count is null for depots with no product_availability rows.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [locationId, locationName]
                      properties:
                        locationId:
                          type: string
                        locationName:
                          type: string
                        productAvailabilityCount:
                          type: integer
                          nullable: true
  /api/migration/productAvailability/count:
    get:
      operationId: readProductAvailabilityCount
      summary: Read the product availability row count for one location
      parameters:
        - $ref: '#/components/parameters/locationId'
      responses:
        '200':
          description: The row count for the location (null when no rows).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [locationId]
                    properties:
                      locationId:
                        type: string
                      count:
                        type: integer
                        nullable: true
        '404':
          $ref: '#/components/responses/LocationNotFound'
  /api/migration/productAvailability/calculate:
    get:
      operationId: calculateProductAvailability
      summary: Calculate (without persisting) bin location rows for one location
      description: >
        Runs the expensive ProductAvailabilityService.calculateBinLocations
        query and returns the number of rows that a refresh would produce.
      parameters:
        - $ref: '#/components/parameters/locationId'
      responses:
        '200':
          description: The calculated bin location row count.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [locationId, count]
                    properties:
                      locationId:
                        type: string
                      count:
                        type: integer
        '404':
          $ref: '#/components/responses/LocationNotFound'
  /api/migration/productAvailability/refresh:
    post:
      operationId: refreshProductAvailability
      summary: Refresh the product availability materialized view
      parameters:
        - name: locationId
          in: query
          required: false
          schema:
            type: string
          description: >
            When present, refreshes only this location; otherwise refreshes
            all locations (like the legacy report/refreshProductAvailability).
      responses:
        '200':
          $ref: '#/components/responses/RefreshMessage'
        '404':
          $ref: '#/components/responses/LocationNotFound'
  /api/migration/productDemand/refresh:
    post:
      operationId: refreshProductDemand
      summary: Refresh the product demand materialized view
      responses:
        '200':
          $ref: '#/components/responses/RefreshMessage'
components:
  parameters:
    locationId:
      name: locationId
      in: query
      required: true
      schema:
        type: string
      description: Location id.
  responses:
    LocationNotFound:
      description: No location for the given id.
      content:
        application/json:
          schema:
            $ref: '../components/common.yaml#/components/schemas/ErrorResponse'
    RefreshMessage:
      description: Refresh completed; returns a human-readable message.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: string
  securitySchemes:
    cookieAuth:
      $ref: '../components/common.yaml#/components/securitySchemes/cookieAuth'
