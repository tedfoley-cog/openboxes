openapi: 3.0.3
info:
  title: OpenBoxes - PreferenceTypeApiController
  description: >
    CRUD endpoints for preference types handled by
    org.pih.warehouse.api.PreferenceTypeApiController, routed via
    "/api/preferenceTypes" and "/api/preferenceTypes/{id}". Added in
    Phase 2 (Batch 30) for the migrated preferenceType list/create/edit
    screens. Option lists for existing preference types are served by
    "/api/preferenceTypeOptions" (select-options-api.yaml).
  version: 0.1.0
servers:
  - url: http://localhost:8080/openboxes
    description: Local Docker baseline (docs/migration/RUNNING_LOCALLY.md)
security:
  - cookieAuth: []
paths:
  /api/preferenceTypes:
    get:
      operationId: listPreferenceTypes
      summary: Paginated list of preference types
      parameters:
        - name: max
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
        - name: sort
          in: query
          schema:
            type: string
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - name: q
          in: query
          description: Name prefix filter.
          schema:
            type: string
      responses:
        '200':
          description: Paginated preference types.
          content:
            application/json:
              schema:
                type: object
                required: [data, totalCount]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PreferenceType'
                  totalCount:
                    type: integer
    post:
      operationId: createPreferenceType
      summary: Create a preference type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferenceTypeRequest'
      responses:
        '201':
          description: Created preference type.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PreferenceType'
        '400':
          description: Validation errors (e.g. blank or duplicate name, invalid validation code).
          content:
            application/json:
              schema:
                $ref: '../components/common.yaml#/components/schemas/ErrorResponse'
  /api/preferenceTypes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '../components/common.yaml#/components/schemas/Id'
        description: Preference type id.
    get:
      operationId: readPreferenceType
      summary: Read a preference type
      responses:
        '200':
          description: The preference type.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PreferenceType'
        '404':
          description: Unknown preference type id.
          content:
            application/json:
              schema:
                $ref: '../components/common.yaml#/components/schemas/ErrorResponse'
    put:
      operationId: updatePreferenceType
      summary: Update a preference type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferenceTypeRequest'
      responses:
        '200':
          description: Updated preference type.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PreferenceType'
        '400':
          description: Validation errors (e.g. blank or duplicate name, invalid validation code).
          content:
            application/json:
              schema:
                $ref: '../components/common.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Unknown preference type id.
          content:
            application/json:
              schema:
                $ref: '../components/common.yaml#/components/schemas/ErrorResponse'
components:
  schemas:
    PreferenceTypeRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        validationCode:
          type: string
          nullable: true
          enum: [HIDE, WARN, BLOCK, DEFAULT, ALLOW_ONLY, PREFERRED, null]
    PreferenceType:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: '../components/common.yaml#/components/schemas/Id'
        name:
          type: string
        validationCode:
          type: string
          nullable: true
        dateCreated:
          type: string
          nullable: true
        lastUpdated:
          type: string
          nullable: true
      additionalProperties: true
  securitySchemes:
    cookieAuth:
      $ref: '../components/common.yaml#/components/securitySchemes/cookieAuth'
