openapi: 3.0.3
info:
  title: OpenBoxes - ProductApiController
  description: >
    Product listing, search, availability/demand lookups and creation handled
    by org.pih.warehouse.api.ProductApiController. Routed via the explicit
    "/api/products" mappings (GET list / POST save), "/api/products/search",
    the per-action "/api/products/$id/$action" mapping (demand, demandSummary,
    productSummary, productAvailability, availableBins, substitutions,
    associatedProducts, withCatalogs, productAvailabilityAndDemand,
    productDemand), "/api/products/$productId/inventoryItems/$lotNumber",
    "/api/products/getLatestInventoryCountDate", "/api/products/import",
    "/api/products/availableItems",
    "/api/products/inventoryItems/lotNumbersWithExpirationDate",
    "/api/products/mergeLogs", "/api/products/batchEdit",
    "/api/products/validateImport", "/api/products/$id/details" and
    "/api/products/$id/documents". Parity
    quirks pinned here: save() responds 200 (not 201) with a {"product": ...}
    envelope (not "data"); unknown product ids on the per-product lookups do
    NOT 404 (Product.get()/load() simply yields null/empty data or a 500 when
    the null is dereferenced); availableItems/availableBins without a location
    and at least one product id respond 500 (IllegalArgumentException).
  version: 0.1.0
servers:
  - url: http://localhost:8080/openboxes
    description: Local Docker baseline (docs/migration/RUNNING_LOCALLY.md)
security:
  - cookieAuth: []
paths:
  /api/products:
    get:
      operationId: listProducts
      summary: List products
      description: >
        Paged product listing. "q" fans out to name/description/brand/
        manufacturer/vendor/productCode/unitOfMeasure matching. format=csv
        downloads every product as a text/csv attachment (max is forced to
        -1); format=list renders compact ProductListItem objects instead of
        the default product marshalling.
      parameters:
        - $ref: '../components/common.yaml#/components/parameters/max'
        - $ref: '../components/common.yaml#/components/parameters/offset'
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
        - name: tagId
          in: query
          required: false
          schema:
            type: string
        - name: catalogId
          in: query
          required: false
          schema:
            type: string
        - name: includeInactive
          in: query
          required: false
          schema:
            type: boolean
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [csv, list]
      responses:
        '200':
          description: Products with pagination total (or a CSV attachment).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  totalCount:
                    type: integer
                    nullable: true
            text/csv:
              schema:
                type: string
    post:
      operationId: createProduct
      summary: Create a product
      description: >
        save() - responds 200 with {"product": Product.toFullJson()} (no
        "data" envelope). A productCode is generated when omitted. Validation
        failures respond 400; a non-default productType without code and
        identifier format responds 500 (IllegalArgumentException).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                category:
                  type: object
                  properties:
                    id:
                      $ref: '../components/common.yaml#/components/schemas/Id'
                productCode:
                  type: string
                description:
                  type: string
                unitOfMeasure:
                  type: string
                pricePerUnit:
                  type: number
                active:
                  type: boolean
              additionalProperties: true
      responses:
        '200':
          description: The created product (Product.toFullJson()).
          content:
            application/json:
              schema:
                type: object
                required: [product]
                properties:
                  product:
                    type: object
                    description: Product.toFullJson() rendering (large; loosely pinned).
                    properties:
                      id:
                        $ref: '../components/common.yaml#/components/schemas/Id'
                      name:
                        type: string
                      productCode:
                        type: string
                    additionalProperties: true
        '400':
          $ref: '../components/common.yaml#/components/responses/ValidationError'
        '500':
          $ref: '../components/common.yaml#/components/responses/ServerError'
  /api/products/search:
    get:
      operationId: searchProducts
      summary: Typeahead product search
      description: >
        Splits "name" into terms on commas/spaces. Terms shorter than the
        configured typeahead minimum render {"data": []}. With
        availableItems=true the results are grouped bin-location availability
        summaries instead of plain product DTOs.
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
        - name: availableItems
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Matching products (ProductDto rendering).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          $ref: '../components/common.yaml#/components/schemas/Id'
                        name:
                          type: string
                          nullable: true
                        productCode:
                          type: string
                          nullable: true
                        displayName:
                          type: string
                          nullable: true
                        exactMatch:
                          type: boolean
                        active:
                          type: boolean
                        color:
                          type: string
                          nullable: true
                        lotAndExpiryControl:
                          type: boolean
                        unitOfMeasure:
                          type: string
                          nullable: true
                        handlingIcons:
                          type: array
                          items:
                            type: object
                            additionalProperties: true
                      additionalProperties: true
  /api/products/{id}/demand:
    get:
      operationId: getProductDemand
      summary: Demand for a product at the session warehouse
      parameters:
        - $ref: '#/components/parameters/productId'
      responses:
        '200':
          description: Demand figures plus the product and session location.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [demand, location, product]
                    properties:
                      demand:
                        type: object
                        properties:
                          dailyDemand:
                            type: number
                          monthlyDemand:
                            type: number
                          onHandMonths:
                            type: number
                          quantityOnHand:
                            type: integer
                            nullable: true
                          totalDays:
                            type: integer
                          totalDemand:
                            type: number
                        additionalProperties: true
                      location:
                        type: object
                        nullable: true
                        allOf:
                          - $ref: '../components/common.yaml#/components/schemas/Location'
                      product:
                        type: object
                        nullable: true
                        allOf:
                          - $ref: '#/components/schemas/Product'
  /api/products/{id}/demandSummary:
    get:
      operationId: getProductDemandSummary
      summary: Monthly demand summary for a product at the session warehouse
      parameters:
        - $ref: '#/components/parameters/productId'
      responses:
        '200':
          description: Monthly demand summary rows (empty when no demand).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
  /api/products/{id}/productSummary:
    get:
      operationId: getProductSummary
      summary: Quantity on hand for a product at the session warehouse
      parameters:
        - $ref: '#/components/parameters/productId'
      responses:
        '200':
          description: Product/location ids and summed quantity on hand.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [product, location]
                    properties:
                      product:
                        type: object
                        properties:
                          id:
                            $ref: '../components/common.yaml#/components/schemas/Id'
                      location:
                        type: object
                        properties:
                          id:
                            $ref: '../components/common.yaml#/components/schemas/Id'
                      quantityOnHand:
                        type: integer
                        nullable: true
                        description: Null when the product has no availability rows.
  /api/products/{id}/productAvailability:
    get:
      operationId: getProductAvailability
      summary: ProductAvailability rows for a product at the session warehouse
      parameters:
        - $ref: '#/components/parameters/productId'
      responses:
        '200':
          description: One row per bin location / inventory item.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          $ref: '../components/common.yaml#/components/schemas/Id'
                        productCode:
                          type: string
                          nullable: true
                        lotNumber:
                          type: string
                          nullable: true
                        binLocationName:
                          type: string
                          nullable: true
                        quantityOnHand:
                          type: integer
                        quantityAllocated:
                          type: integer
                        quantityOnHold:
                          type: integer
                        quantityNotPicked:
                          type: integer
                        quantityAvailableToPromise:
                          type: integer
                      additionalProperties: true
  /api/products/{id}/availableBins:
    get:
      operationId: getAvailableBins
      summary: Available bin locations for a product
      description: >
        Same rendering as /api/products/availableItems, keyed off the path
        product id. Responds 500 when the session has no warehouse and no
        location.id parameter is given.
      parameters:
        - $ref: '#/components/parameters/productId'
        - $ref: '#/components/parameters/locationIdQuery'
      responses:
        '200':
          $ref: '#/components/responses/AvailableItemsOk'
        '500':
          $ref: '../components/common.yaml#/components/responses/ServerError'
  /api/products/{id}/substitutions:
    get:
      operationId: getProductSubstitutions
      summary: Substitutions (SUBSTITUTE associations) for a product
      description: >
        Forwards to associatedProducts() with type=SUBSTITUTE; the association
        list is rendered under "substitutions".
      parameters:
        - $ref: '#/components/parameters/productId'
        - $ref: '#/components/parameters/locationIdQuery'
      responses:
        '200':
          $ref: '#/components/responses/AssociatedProductsOk'
  /api/products/{id}/associatedProducts:
    get:
      operationId: getAssociatedProducts
      summary: Associated products for a product
      description: >
        The association list is rendered under the "resource" parameter's
        value ("productAssociations" by default).
      parameters:
        - $ref: '#/components/parameters/productId'
        - $ref: '#/components/parameters/locationIdQuery'
        - name: type
          in: query
          required: false
          description: ProductAssociationTypeCode values (e.g. SUBSTITUTE).
          schema:
            type: string
        - name: resource
          in: query
          required: false
          description: Key under which the association list is rendered.
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/AssociatedProductsOk'
  /api/products/{id}/withCatalogs:
    get:
      operationId: getProductWithCatalogs
      summary: Product with its catalog memberships
      parameters:
        - $ref: '#/components/parameters/productId'
      responses:
        '200':
          description: Compact product with catalog id/name pairs.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, catalogs]
                    properties:
                      id:
                        $ref: '../components/common.yaml#/components/schemas/Id'
                      name:
                        type: string
                        nullable: true
                      productCode:
                        type: string
                        nullable: true
                      catalogs:
                        type: array
                        nullable: true
                        items:
                          type: object
                          properties:
                            id:
                              $ref: '../components/common.yaml#/components/schemas/Id'
                            name:
                              type: string
                              nullable: true
  /api/products/{id}/productAvailabilityAndDemand:
    get:
      operationId: getProductAvailabilityAndDemand
      summary: Quantity on hand/available and monthly demand at a location
      parameters:
        - $ref: '#/components/parameters/productId'
        - name: locationId
          in: query
          required: true
          schema:
            $ref: '../components/common.yaml#/components/schemas/Id'
      responses:
        '200':
          description: Bare object - no "data" envelope.
          content:
            application/json:
              schema:
                type: object
                required: [monthlyDemand, quantityOnHand, quantityAvailable]
                properties:
                  monthlyDemand:
                    type: number
                  quantityOnHand:
                    type: integer
                  quantityAvailable:
                    type: integer
  /api/products/{id}/productDemand:
    get:
      operationId: getProductDemandBetweenLocations
      summary: Monthly demand between an origin and destination
      parameters:
        - $ref: '#/components/parameters/productId'
        - name: originId
          in: query
          required: false
          schema:
            $ref: '../components/common.yaml#/components/schemas/Id'
        - name: destinationId
          in: query
          required: false
          schema:
            $ref: '../components/common.yaml#/components/schemas/Id'
      responses:
        '200':
          description: Bare object - no "data" envelope.
          content:
            application/json:
              schema:
                type: object
                required: [monthlyDemand, quantityOnHand]
                properties:
                  monthlyDemand:
                    type: number
                  quantityOnHand:
                    type: integer
                    nullable: true
  /api/products/{productId}/inventoryItems/{lotNumber}:
    get:
      operationId: getInventoryItem
      summary: Inventory item lookup by product and lot number
      description: >
        Parity quirk: unknown product/lot combinations do NOT 404 - the
        endpoint responds 200 with {"inventoryItem": null, "quantityOnHand": 0}.
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            $ref: '../components/common.yaml#/components/schemas/Id'
        - name: lotNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Bare object - no "data" envelope.
          content:
            application/json:
              schema:
                type: object
                required: [inventoryItem, quantityOnHand]
                properties:
                  inventoryItem:
                    type: object
                    nullable: true
                    description: Default Grails rendering of InventoryItem.
                    additionalProperties: true
                  quantityOnHand:
                    type: integer
  /api/products/getLatestInventoryCountDate:
    get:
      operationId: getLatestInventoryCountDate
      summary: Latest inventory count date per product
      parameters:
        - name: productIds
          in: query
          required: false
          description: Repeatable product id parameter.
          schema:
            type: string
      responses:
        '200':
          description: Map of product id to latest count timestamp.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties:
                      type: string
                      nullable: true
  /api/products/availableItems:
    get:
      operationId: getAvailableItems
      summary: Available bin locations for one or more products
      description: >
        Requires a location (location.id parameter or session warehouse) and
        at least one product id ("product.id" or "id", repeatable); otherwise
        responds 500 (IllegalArgumentException).
      parameters:
        - name: product.id
          in: query
          required: false
          schema:
            type: string
        - name: id
          in: query
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/locationIdQuery'
      responses:
        '200':
          $ref: '#/components/responses/AvailableItemsOk'
        '500':
          $ref: '../components/common.yaml#/components/responses/ServerError'
  /api/products/inventoryItems/lotNumbersWithExpirationDate:
    get:
      operationId: getLotNumbersWithExpirationDate
      summary: Lot numbers with expiration dates per product
      parameters:
        - name: productIds
          in: query
          required: false
          description: Repeatable product id parameter.
          schema:
            type: string
      responses:
        '200':
          description: >
            Map of product id to lot-number entries (empty object when the
            products have no lots).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: object
                        additionalProperties: true
  /api/products/import:
    post:
      operationId: importProductsCsv
      summary: Import products from a CSV request body
      description: >
        Reads the raw request body as CSV (Content-Type must be text/csv;
        anything else, or an empty body, responds 500 via
        IllegalArgumentException). Responds 200 with the imported products.
        Not exercised by the contract suite - a successful import would
        permanently add products to the seeded dataset (no delete API).
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
      responses:
        '200':
          description: The imported products.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '500':
          $ref: '../components/common.yaml#/components/responses/ServerError'
  /api/products/mergeLogs:
    get:
      operationId: listProductMergeLogs
      summary: Product merge log listing (React product/productMergeLogs screen)
      description: >
        Paged listing of ProductMergeLogger rows, optionally filtered by
        exact primary/obsolete product code. Mirrors the legacy
        ProductController.productMergeLogs screen (default max=10, offset=0).
      parameters:
        - $ref: '../components/common.yaml#/components/parameters/max'
        - $ref: '../components/common.yaml#/components/parameters/offset'
        - name: primaryProductCode
          in: query
          required: false
          schema:
            type: string
        - name: obsoleteProductCode
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Merge log rows with pagination total.
          content:
            application/json:
              schema:
                type: object
                required: [data, totalCount]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, primaryProduct, obsoleteProduct]
                      properties:
                        id:
                          $ref: '../components/common.yaml#/components/schemas/Id'
                        primaryProduct:
                          $ref: '#/components/schemas/ProductCodeRef'
                        obsoleteProduct:
                          $ref: '#/components/schemas/ProductCodeRef'
                        relatedObjectId:
                          type: string
                          nullable: true
                        relatedObjectClassName:
                          type: string
                          nullable: true
                        dateMerged:
                          type: string
                          nullable: true
                        createdBy:
                          type: string
                          nullable: true
                  totalCount:
                    type: integer
  /api/products/batchEdit:
    get:
      operationId: listBatchEditProducts
      summary: Filtered product rows for the React product/batchEdit screen
      description: >
        Mirrors legacy ProductController.batchEdit - rows are only returned
        once a categoryId or tagId filter is supplied ({"data": [],
        "totalCount": 0} otherwise). Supports the legacy filter parameters
        (name, productCode(+IsNull), unitOfMeasure(+IsNull),
        brandName(+IsNull), manufacturer(+IsNull), manufacturerCode(+IsNull),
        vendor(+IsNull), vendorCode(+IsNull), includeCategoryChildren,
        createdById, updatedById).
      parameters:
        - $ref: '../components/common.yaml#/components/parameters/max'
        - $ref: '../components/common.yaml#/components/parameters/offset'
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
        - name: tagId
          in: query
          required: false
          schema:
            type: string
        - name: includeCategoryChildren
          in: query
          required: false
          schema:
            type: boolean
        - name: name
          in: query
          required: false
          schema:
            type: string
        - name: productCode
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Editable product rows with pagination total.
          content:
            application/json:
              schema:
                type: object
                required: [data, totalCount]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id]
                      properties:
                        id:
                          $ref: '../components/common.yaml#/components/schemas/Id'
                        productCode:
                          type: string
                          nullable: true
                        name:
                          type: string
                          nullable: true
                        category:
                          type: object
                          properties:
                            id:
                              $ref: '../components/common.yaml#/components/schemas/Id'
                            name:
                              type: string
                              nullable: true
                        manufacturer:
                          type: string
                          nullable: true
                        manufacturerCode:
                          type: string
                          nullable: true
                        brandName:
                          type: string
                          nullable: true
                        unitOfMeasure:
                          type: string
                          nullable: true
                        coldChain:
                          type: boolean
                          nullable: true
                        createdBy:
                          type: string
                          nullable: true
                        updatedBy:
                          type: string
                          nullable: true
                        dateCreated:
                          type: string
                          nullable: true
                        lastUpdated:
                          type: string
                          nullable: true
                  totalCount:
                    type: integer
    post:
      operationId: batchSaveProducts
      summary: Bulk product update for the React product/batchEdit screen
      description: >
        Accepts {"products": [{id, productCode, name, category{id},
        manufacturer, manufacturerCode, brandName, unitOfMeasure,
        coldChain}]}. Responds 200 with {"savedCount": n}; validation errors
        respond 400 with {"errorMessages": [...]} (mirrors legacy batchSave).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [products]
              properties:
                products:
                  type: array
                  items:
                    type: object
                    required: [id]
                    properties:
                      id:
                        $ref: '../components/common.yaml#/components/schemas/Id'
                    additionalProperties: true
      responses:
        '200':
          description: Number of products saved.
          content:
            application/json:
              schema:
                type: object
                required: [savedCount]
                properties:
                  savedCount:
                    type: integer
        '400':
          $ref: '../components/common.yaml#/components/responses/ValidationError'
  /api/products/validateImport:
    post:
      operationId: validateImportProductsCsv
      summary: Validate a product import CSV without persisting (React importAsCsv step 2)
      description: >
        Same text/csv request body contract as /api/products/import (empty
        body or wrong content type responds 500 via IllegalArgumentException;
        invalid rows respond 400 with {"errorMessage": ...}). Returns the
        parsed rows plus each matched existing product's current values so
        the UI can highlight changes. Does not persist anything.
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
      responses:
        '200':
          description: Parsed rows, CSV column headers and row count.
          content:
            application/json:
              schema:
                type: object
                required: [data, columns, totalCount]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [isNew]
                      properties:
                        isNew:
                          type: boolean
                        existingProduct:
                          type: object
                          nullable: true
                          additionalProperties: true
                      additionalProperties: true
                  columns:
                    type: array
                    items:
                      type: string
                  totalCount:
                    type: integer
        '400':
          $ref: '../components/common.yaml#/components/responses/ValidationError'
        '500':
          $ref: '../components/common.yaml#/components/responses/ServerError'
  /api/products/{id}/details:
    get:
      operationId: getProductDetails
      summary: Full product details for the React product/edit screen
      description: >
        Form fields, attribute values, tags (comma-joined string),
        productType displayedFields and the read-only collections shown on
        the legacy edit tabs (documents, packages, catalogs, groups,
        synonyms, associations, suppliers, inventory levels). Unknown ids
        respond 404 with {"errorMessage": ...}.
      parameters:
        - $ref: '#/components/parameters/productId'
      responses:
        '200':
          description: Product details envelope.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, displayedFields, attributes, documents]
                    properties:
                      id:
                        $ref: '../components/common.yaml#/components/schemas/Id'
                      productCode:
                        type: string
                        nullable: true
                      name:
                        type: string
                        nullable: true
                      displayedFields:
                        type: array
                        items:
                          type: string
                      attributes:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                      documents:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                      tags:
                        type: string
                        nullable: true
                    additionalProperties: true
        '404':
          $ref: '#/components/responses/ProductNotFound'
    put:
      operationId: updateProductDetails
      summary: Update a product from the React product/edit screen
      description: >
        Accepts the form fields plus tags (comma-separated string) and
        attributes ([{attribute: {id}, value}]), mirroring legacy
        ProductController.update (including optimistic-lock version check and
        required-attribute validation). Validation failures respond 400 with
        {"errorMessages": [...]}; unknown ids respond 404.
      parameters:
        - $ref: '#/components/parameters/productId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: The updated product (Product.toFullJson()) - same envelope as POST /api/products.
          content:
            application/json:
              schema:
                type: object
                required: [product]
                properties:
                  product:
                    type: object
                    additionalProperties: true
        '400':
          $ref: '../components/common.yaml#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ProductNotFound'
  /api/products/{id}/documents:
    post:
      operationId: uploadProductDocument
      summary: Upload a document to a product (React product/addDocument screen)
      description: >
        Multipart form data with an optional "fileContents" file plus name,
        typeId and fileUri fields (a file or a fileUri is required; typeId
        defaults to the default document type). Mirrors legacy
        DocumentController.uploadDocument for the product case. Disallowed
        file types, template document types, empty payloads and >10MB files
        respond 400; unknown product ids respond 404.
      parameters:
        - $ref: '#/components/parameters/productId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                fileContents:
                  type: string
                  format: binary
                name:
                  type: string
                typeId:
                  type: string
                fileUri:
                  type: string
      responses:
        '200':
          description: The created document.
          content:
            application/json:
              schema:
                type: object
                required: [document]
                properties:
                  document:
                    type: object
                    required: [id]
                    properties:
                      id:
                        $ref: '../components/common.yaml#/components/schemas/Id'
                      name:
                        type: string
                        nullable: true
                      filename:
                        type: string
                        nullable: true
                      fileUri:
                        type: string
                        nullable: true
                      documentType:
                        type: string
                        nullable: true
        '400':
          $ref: '../components/common.yaml#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ProductNotFound'
  /api/products/{id}/documents/{documentId}:
    delete:
      operationId: deleteProductDocument
      summary: Remove a document from a product
      description: >
        Deletes the document and its product association (documents tab of
        the React product/edit screen). Responds 204 with no body; unknown
        product/document ids respond 404.
      parameters:
        - $ref: '#/components/parameters/productId'
        - name: documentId
          in: path
          required: true
          schema:
            $ref: '../components/common.yaml#/components/schemas/Id'
      responses:
        '204':
          description: Document removed.
        '404':
          $ref: '#/components/responses/ProductNotFound'
components:
  parameters:
    productId:
      name: id
      in: path
      required: true
      description: >
        Product id. Unknown ids do NOT 404 (see individual operations).
      schema:
        $ref: '../components/common.yaml#/components/schemas/Id'
    locationIdQuery:
      name: location.id
      in: query
      required: false
      description: Location id (defaults to the session warehouse).
      schema:
        $ref: '../components/common.yaml#/components/schemas/Id'
  responses:
    ProductNotFound:
      description: Product (or document) not found.
      content:
        application/json:
          schema:
            type: object
            required: [errorMessage]
            properties:
              errorMessage:
                type: string
    AvailableItemsOk:
      description: Available inventory grouped by bin location.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    binLocation:
                      type: object
                      nullable: true
                      allOf:
                        - $ref: '../components/common.yaml#/components/schemas/Location'
                    quantityAvailable:
                      type: integer
                      nullable: true
                    quantityOnHand:
                      type: integer
                      nullable: true
                  additionalProperties: true
    AssociatedProductsOk:
      description: >
        Product associations plus current availability. The association list
        is rendered under a dynamic key ("substitutions" for the
        substitutions endpoint, otherwise the "resource" parameter or
        "productAssociations").
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required:
                  - product
                  - availableItems
                  - hasAssociations
                  - hasEarlierExpiringItems
                properties:
                  product:
                    type: object
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/Product'
                  availableItems:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  hasAssociations:
                    type: boolean
                  hasEarlierExpiringItems:
                    type: boolean
                additionalProperties: true
  schemas:
    ProductCodeRef:
      type: object
      properties:
        id:
          $ref: '../components/common.yaml#/components/schemas/Id'
        productCode:
          type: string
          nullable: true
    Product:
      type: object
      description: >
        Compact product rendering produced by the registered Product JSON
        marshaller (used by list() and nested product references).
      properties:
        id:
          $ref: '../components/common.yaml#/components/schemas/Id'
        name:
          type: string
          nullable: true
        productCode:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        unitOfMeasure:
          type: string
          nullable: true
        pricePerUnit:
          type: number
          nullable: true
        active:
          type: boolean
        color:
          type: string
          nullable: true
        lotAndExpiryControl:
          type: boolean
        dateCreated:
          type: string
          nullable: true
        lastUpdated:
          type: string
          nullable: true
        updatedBy:
          type: string
          nullable: true
        displayNames:
          type: object
          nullable: true
          additionalProperties: true
        handlingIcons:
          type: array
          nullable: true
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
  securitySchemes:
    cookieAuth:
      $ref: '../components/common.yaml#/components/securitySchemes/cookieAuth'
