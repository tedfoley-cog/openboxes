openapi: 3.0.3
info:
  title: OpenBoxes - ProductTypeApiController
  description: >
    Product type create/delete endpoints handled by
    org.pih.warehouse.api.ProductTypeApiController, routed via the explicit
    "/api/productTypes" and "/api/productTypes/$id" mappings. Added in
    Phase 2 (Batch 11) to back the React productType create screen and
    extended in Batch 12 with list/read/update for the React productType
    list/edit/show screens. Parity quirks preserved from the legacy save action: productTypeCode is always
    forced to GOOD and requiredFields to [PRODUCT_CODE, NAME, CATEGORY,
    GL_ACCOUNT] regardless of input; a request with neither code nor
    productIdentifierFormat is rejected with the
    productType.codeOrIdentifierRequired.message validation error. Delete
    refuses the default product type and types with existing products (400).
  version: 0.1.0
servers:
  - url: http://localhost:8080/openboxes
    description: Local Docker baseline (docs/migration/RUNNING_LOCALLY.md)
security:
  - cookieAuth: []
paths:
  /api/productTypes:
    get:
      operationId: listProductTypes
      summary: List product types
      description: >
        Paged listing backing the React productType list screen. Sortable by
        id, name, productTypeCode, productIdentifierFormat, sequenceNumber,
        dateCreated and lastUpdated (default name asc).
      parameters:
        - name: max
          in: query
          schema:
            type: integer
            default: 10
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: sort
          in: query
          schema:
            type: string
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '200':
          description: Page of product types.
          content:
            application/json:
              schema:
                type: object
                required: [data, totalCount]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductType'
                  totalCount:
                    type: integer
    post:
      operationId: createProductType
      summary: Create a product type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                code:
                  type: string
                  nullable: true
                productIdentifierFormat:
                  type: string
                  nullable: true
                sequenceNumber:
                  type: integer
                  nullable: true
                  description: Defaults to 0 when absent or empty.
                supportedActivities:
                  type: array
                  items:
                    type: string
                  description: ProductActivityCode enum names.
                displayedFields:
                  type: array
                  items:
                    type: string
                  description: ProductField enum names.
      responses:
        '201':
          description: Created product type.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ProductType'
        '400':
          $ref: '../components/common.yaml#/components/responses/ValidationError'
  /api/productTypes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '../components/common.yaml#/components/schemas/Id'
        description: >
          Product type id. Unknown ids raise ObjectNotFoundException,
          rendered as HTTP 404 by ErrorsController.handleNotFound.
    get:
      operationId: readProductType
      summary: Read a product type
      responses:
        '200':
          description: The product type.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ProductType'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
    put:
      operationId: updateProductType
      summary: Update a product type
      description: >
        Only the fields the legacy edit form exposes are updatable: name,
        sequenceNumber, supportedActivities and displayedFields.
        productTypeCode, requiredFields, code and productIdentifierFormat
        are read-only. Keys absent from the payload are left unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                sequenceNumber:
                  type: integer
                  nullable: true
                  description: Reset to 0 when null or empty.
                supportedActivities:
                  type: array
                  items:
                    type: string
                  description: ProductActivityCode enum names (replaces the set).
                displayedFields:
                  type: array
                  items:
                    type: string
                  description: ProductField enum names (replaces the set).
      responses:
        '200':
          description: Updated product type.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ProductType'
        '400':
          $ref: '../components/common.yaml#/components/responses/ValidationError'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
    delete:
      operationId: deleteProductType
      summary: Delete a product type
      description: >
        Refuses to delete the configured default product type or a type that
        still has products (both 400 with an errorMessage).
      responses:
        '204':
          description: Product type deleted (empty body).
        '400':
          description: Product type cannot be deleted.
          content:
            application/json:
              schema:
                $ref: '../components/common.yaml#/components/schemas/ErrorResponse'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
components:
  schemas:
    ProductType:
      type: object
      required: [id, name, productTypeCode]
      properties:
        id:
          $ref: '../components/common.yaml#/components/schemas/Id'
        name:
          type: string
        code:
          type: string
          nullable: true
        productTypeCode:
          type: string
          enum: [GOOD, SERVICE, FIXED_ASSET, ASSET_USAGE]
          description: Always GOOD for types created through this endpoint.
        productIdentifierFormat:
          type: string
          nullable: true
        sequenceNumber:
          type: integer
          nullable: true
        supportedActivities:
          type: array
          items:
            type: string
        requiredFields:
          type: array
          items:
            type: string
          description: Always [CATEGORY, GL_ACCOUNT, NAME, PRODUCT_CODE] (sorted).
        displayedFields:
          type: array
          items:
            type: string
        dateCreated:
          type: string
          nullable: true
        lastUpdated:
          type: string
          nullable: true
        productCount:
          type: integer
          description: >
            Number of products of this type (drives the legacy edit screen's
            conditional identifier-format row). Included on read/create/update
            responses; omitted from list rows to avoid a per-row count query.
  securitySchemes:
    cookieAuth:
      $ref: '../components/common.yaml#/components/securitySchemes/cookieAuth'
