openapi: 3.0.3
info:
  title: OpenBoxes - RequisitionApiController
  description: >
    Classic requisition flow endpoints handled by
    org.pih.warehouse.api.RequisitionApiController, added for the React
    migration of the legacy requisition screens (create, chooseTemplate,
    confirm, addDocument, show, review, process, transfer, printDraft).
    Routed via the "/api/requisitions/..." URL mappings.
  version: 0.1.0
servers:
  - url: http://localhost:8080/openboxes
    description: Local Docker baseline (docs/migration/RUNNING_LOCALLY.md)
security:
  - cookieAuth: []
paths:
  /api/requisitions:
    get:
      operationId: listRequisitions
      summary: List requisitions for the current warehouse (classic list screen)
      description: >
        Mirrors the legacy RequisitionController.list action - requisitions
        are always scoped to the session warehouse as origin and filterable
        by the same criteria as the legacy filter form. Also returns the
        status-count statistics used by the status button bar.
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { type: string }
        - name: type
          in: query
          required: false
          schema: { type: string }
        - name: commodityClass
          in: query
          required: false
          schema: { type: string }
        - name: destinationId
          in: query
          required: false
          schema: { type: string }
        - name: requestedById
          in: query
          required: false
          schema: { type: string }
        - name: createdById
          in: query
          required: false
          schema: { type: string }
        - name: updatedById
          in: query
          required: false
          schema: { type: string }
        - name: relatedToMe
          in: query
          required: false
          schema: { type: string }
        - name: max
          in: query
          required: false
          schema: { type: integer }
      responses:
        '200':
          description: Requisitions plus statistics.
          content:
            application/json:
              schema:
                type: object
                required: [data, totalCount, statistics]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id]
                      properties:
                        id:
                          $ref: '../components/common.yaml#/components/schemas/Id'
                        requestNumber:
                          type: string
                          nullable: true
                        name:
                          type: string
                          nullable: true
                        status:
                          type: string
                          nullable: true
                        type:
                          type: string
                          nullable: true
                        requisitionItemCount:
                          type: integer
                        requestedBy:
                          type: string
                          nullable: true
                        dateRequested:
                          type: string
                          nullable: true
                        dateIssued:
                          type: string
                          nullable: true
                        dateCreated:
                          type: string
                          nullable: true
                        dateChecked:
                          type: string
                          nullable: true
                        dateVerified:
                          type: string
                          nullable: true
                        datePicked:
                          type: string
                          nullable: true
                        lastUpdated:
                          type: string
                          nullable: true
                  totalCount:
                    type: integer
                  statistics:
                    type: object
                    additionalProperties:
                      type: integer
    post:
      operationId: createRequisition
      summary: Create a requisition (classic flow)
      description: >
        Creates a requisition in CREATED status, mirroring the legacy
        RequisitionController.save action. The name is generated from type,
        destination, commodity class and date requested when not provided,
        and a request number is generated. Validation errors return 400 with
        an errors array.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: RequisitionType enum name (e.g. ADHOC, STOCK).
                originId:
                  type: string
                  nullable: true
                  description: Defaults to the session warehouse when omitted.
                destinationId:
                  type: string
                  nullable: true
                requestedById:
                  type: string
                  nullable: true
                commodityClass:
                  type: string
                  nullable: true
                  description: CommodityClass enum name.
                dateRequested:
                  type: string
                  nullable: true
                  description: yyyy-MM-dd
                requestedDeliveryDate:
                  type: string
                  nullable: true
                  description: yyyy-MM-dd
                description:
                  type: string
                  nullable: true
                name:
                  type: string
                  nullable: true
                requisitionItems:
                  type: array
                  nullable: true
                  description: >
                    Initial requisition items (used by the createStock screen
                    when creating a stock requisition from a template).
                  items:
                    type: object
                    required: [productId, quantity]
                    properties:
                      productId: { type: string }
                      quantity: { type: integer }
                      orderIndex: { type: integer, nullable: true }
                      templateItemId:
                        type: string
                        nullable: true
                        description: >
                          Id of the stock list template item this item was
                          created from; the inventory item and product package
                          are copied from it.
      responses:
        '201':
          description: Requisition created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, requestNumber]
                    properties:
                      id:
                        $ref: '../components/common.yaml#/components/schemas/Id'
                      requestNumber:
                        type: string
                      name:
                        type: string
                        nullable: true
                      status:
                        type: string
                      type:
                        type: string
                        nullable: true
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/requisitions/templates:
    get:
      operationId: listRequisitionTemplates
      summary: List requisition templates for the current warehouse
      description: >
        Returns published requisition templates whose origin is the session
        warehouse, sorted by destination name. Mirrors the legacy
        selectRequisitionTemplate tag used by the chooseTemplate screen.
      responses:
        '200':
          description: Requisition templates.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id:
                          $ref: '../components/common.yaml#/components/schemas/Id'
                        name:
                          type: string
                          nullable: true
                        requestNumber:
                          type: string
                          nullable: true
                        origin:
                          $ref: '#/components/schemas/NullableNamedReference'
                        destination:
                          $ref: '#/components/schemas/NullableNamedReference'
                        commodityClass:
                          type: string
                          nullable: true

  /api/requisitions/documentTypes:
    get:
      operationId: listRequisitionDocumentTypes
      summary: List document types for the add document screen
      responses:
        '200':
          description: Document types sorted by name.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, value, label]
                      properties:
                        id:
                          $ref: '../components/common.yaml#/components/schemas/Id'
                        value:
                          $ref: '../components/common.yaml#/components/schemas/Id'
                        label:
                          type: string

  /api/requisitions/{id}:
    get:
      operationId: readRequisition
      summary: Read requisition details (classic flow)
      parameters:
        - $ref: '#/components/parameters/requisitionId'
      responses:
        '200':
          $ref: '#/components/responses/RequisitionDetails'
        '404':
          $ref: '#/components/responses/ControllerNotFound'

  /api/requisitions/{id}/confirm:
    post:
      operationId: confirmRequisition
      summary: Move a requisition to CHECKING and return confirm-screen data
      description: >
        Mirrors the legacy RequisitionController.confirm action - transitions
        the requisition status to CHECKING when it has not reached that
        status yet, then returns the details needed by the confirm screen.
      parameters:
        - $ref: '#/components/parameters/requisitionId'
      responses:
        '200':
          $ref: '#/components/responses/RequisitionDetails'
        '404':
          $ref: '#/components/responses/ControllerNotFound'

  /api/requisitions/{id}/details:
    post:
      operationId: saveRequisitionDetails
      summary: Save checked-by / verified-by details
      description: >
        Mirrors the legacy RequisitionController.saveDetails action (confirm
        screen checked-by, review screen verified-by). Only the keys present
        in the body are updated.
      parameters:
        - $ref: '#/components/parameters/requisitionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                checkedById:
                  type: string
                  nullable: true
                dateChecked:
                  type: string
                  nullable: true
                  description: yyyy-MM-dd
                verifiedById:
                  type: string
                  nullable: true
                dateVerified:
                  type: string
                  nullable: true
                  description: yyyy-MM-dd
      responses:
        '200':
          description: Updated details.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id]
                    properties:
                      id:
                        $ref: '../components/common.yaml#/components/schemas/Id'
                      checkedBy:
                        $ref: '#/components/schemas/NullableNamedReference'
                      dateChecked:
                        type: string
                        nullable: true
                      verifiedBy:
                        $ref: '#/components/schemas/NullableNamedReference'
                      dateVerified:
                        type: string
                        nullable: true
        '404':
          $ref: '#/components/responses/ControllerNotFound'

  /api/requisitions/{id}/review:
    post:
      operationId: reviewRequisition
      summary: Move a requisition to VERIFYING and return review-screen data
      description: >
        Mirrors the legacy RequisitionController.review action - transitions
        the requisition status to VERIFYING when it has not reached that
        status yet, then returns the details needed by the review screen,
        including quantity on hand per product at the session warehouse.
      parameters:
        - $ref: '#/components/parameters/requisitionId'
      responses:
        '200':
          description: Requisition review details.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/RequisitionDetails'
                      - type: object
                        required: [quantityOnHandMap]
                        properties:
                          quantityOnHandMap:
                            type: object
                            description: Quantity on hand keyed by product id.
                            additionalProperties:
                              type: integer
        '404':
          $ref: '#/components/responses/ControllerNotFound'

  /api/requisitions/{id}/process:
    get:
      operationId: processRequisition
      summary: Read process-screen data (picklist + inventory items)
      description: >
        Mirrors the data the legacy RequisitionController.process action fed
        to the Knockout picking screen - the requisition details plus the
        inventory items with quantity for each requested product at the
        session warehouse and the current picklist.
      parameters:
        - $ref: '#/components/parameters/requisitionId'
      responses:
        '200':
          description: Requisition process details.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/RequisitionDetails'
                      - type: object
                        required: [productInventoryItemsMap, picklist]
                        properties:
                          productInventoryItemsMap:
                            type: object
                            description: Inventory items keyed by product id.
                            additionalProperties:
                              type: array
                              items:
                                type: object
                                description: InventoryItem.toJson rendering.
                                additionalProperties: true
                                properties:
                                  inventoryItemId:
                                    $ref: '../components/common.yaml#/components/schemas/Id'
                                  lotNumber:
                                    type: string
                                    nullable: true
                                  expirationDate:
                                    type: string
                                    nullable: true
                                    description: MM/dd/yyyy
                                  quantityOnHand:
                                    type: integer
                          picklist:
                            type: object
                            nullable: true
                            required: [id, picklistItems]
                            properties:
                              id:
                                $ref: '../components/common.yaml#/components/schemas/Id'
                              picklistItems:
                                type: array
                                items:
                                  type: object
                                  required: [id, quantity]
                                  properties:
                                    id:
                                      $ref: '../components/common.yaml#/components/schemas/Id'
                                    quantity:
                                      type: integer
                                    lotNumber:
                                      type: string
                                      nullable: true
                                    inventoryItem:
                                      type: object
                                      nullable: true
                                      properties:
                                        id:
                                          $ref: '../components/common.yaml#/components/schemas/Id'
                                    requisitionItem:
                                      type: object
                                      nullable: true
                                      properties:
                                        id:
                                          $ref: '../components/common.yaml#/components/schemas/Id'
        '404':
          $ref: '#/components/responses/ControllerNotFound'

  /api/requisitions/{id}/issue:
    post:
      operationId: issueRequisition
      summary: Issue a requisition (transfer screen Finish)
      description: >
        Mirrors the legacy RequisitionController.complete action - issues the
        requisition via RequisitionService.issueRequisition. Validation
        errors (e.g. nothing picked) return 400.
      parameters:
        - $ref: '#/components/parameters/requisitionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                issuedById:
                  type: string
                  nullable: true
                deliveredById:
                  type: string
                  nullable: true
                comments:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Requisition issued.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, status]
                    properties:
                      id:
                        $ref: '../components/common.yaml#/components/schemas/Id'
                      requestNumber:
                        type: string
                        nullable: true
                      status:
                        type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ControllerNotFound'

  /api/requisitions/{id}/printDraft:
    get:
      operationId: printDraftRequisition
      summary: Read print-draft data for a requisition
      description: >
        Data backing the migrated requisition/printDraft screen - requisition
        header fields plus the requested items with their picklist rows and
        the bin location from the session warehouse's inventory level.
      parameters:
        - $ref: '#/components/parameters/requisitionId'
      responses:
        '200':
          description: Print draft data.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, requestNumber, requisitionItems, hasPicklist]
                    properties:
                      id:
                        $ref: '../components/common.yaml#/components/schemas/Id'
                      requestNumber:
                        type: string
                      name:
                        type: string
                        nullable: true
                      status:
                        type: string
                      origin:
                        $ref: '#/components/schemas/NullableNamedReference'
                      destination:
                        $ref: '#/components/schemas/NullableNamedReference'
                      dateRequested:
                        type: string
                        nullable: true
                      requestedBy:
                        $ref: '#/components/schemas/NullableNamedReference'
                      hasPicklist:
                        type: boolean
                      requisitionItems:
                        type: array
                        items:
                          type: object
                          required: [id, quantity, product, picklistItems]
                          properties:
                            id:
                              $ref: '../components/common.yaml#/components/schemas/Id'
                            quantity:
                              type: integer
                            product:
                              type: object
                              properties:
                                id:
                                  $ref: '../components/common.yaml#/components/schemas/Id'
                                productCode:
                                  type: string
                                name:
                                  type: string
                                  nullable: true
                                unitOfMeasure:
                                  type: string
                                  nullable: true
                            binLocation:
                              type: string
                              nullable: true
                            picklistItems:
                              type: array
                              items:
                                type: object
                                required: [id, quantity]
                                properties:
                                  id:
                                    $ref: '../components/common.yaml#/components/schemas/Id'
                                  quantity:
                                    type: integer
                                  lotNumber:
                                    type: string
                                    nullable: true
                                  expirationDate:
                                    type: string
                                    nullable: true
        '404':
          $ref: '#/components/responses/ControllerNotFound'

  /api/requisitions/{id}/documents:
    post:
      operationId: uploadRequisitionDocument
      summary: Upload a document and attach it to a requisition
      description: >
        Mirrors the requisition branch of the legacy
        DocumentController.uploadDocument action. Multipart upload with
        fileContents plus optional name, typeId and documentNumber fields.
        Empty files, disallowed extensions, oversized files (>= 10 MB) and
        template document types are rejected with 400.
      parameters:
        - $ref: '#/components/parameters/requisitionId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [fileContents]
              properties:
                fileContents:
                  type: string
                  format: binary
                name:
                  type: string
                typeId:
                  type: string
                documentNumber:
                  type: string
      responses:
        '201':
          description: Document created and attached.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id]
                    properties:
                      id:
                        $ref: '../components/common.yaml#/components/schemas/Id'
                      name:
                        type: string
                        nullable: true
                      filename:
                        type: string
                        nullable: true
                      documentNumber:
                        type: string
                        nullable: true
                      documentType:
                        $ref: '#/components/schemas/NullableNamedReference'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ControllerNotFound'

  /api/requisitions/{id}/edit:
    post:
      operationId: editRequisition
      summary: Move a requisition to EDITING and return edit-screen data
      description: >
        Mirrors the legacy RequisitionController.edit action - transitions
        the requisition status to EDITING when it has not reached that
        status yet, then returns the details needed by the edit screen.
      parameters:
        - $ref: '#/components/parameters/requisitionId'
      responses:
        '200':
          $ref: '#/components/responses/RequisitionDetails'
        '404':
          $ref: '#/components/responses/ControllerNotFound'

  /api/requisitions/{id}/header:
    post:
      operationId: updateRequisitionHeader
      summary: Update requisition header fields (editHeader screen)
      description: >
        Mirrors the legacy RequisitionController.saveHeader action. Only the
        keys present in the body are updated.
      parameters:
        - $ref: '#/components/parameters/requisitionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requestNumber: { type: string, nullable: true }
                name: { type: string, nullable: true }
                status: { type: string, nullable: true }
                type: { type: string, nullable: true }
                commodityClass: { type: string, nullable: true }
                originId: { type: string, nullable: true }
                destinationId: { type: string, nullable: true }
                requestedById: { type: string, nullable: true }
                verifiedById: { type: string, nullable: true }
                checkedById: { type: string, nullable: true }
                deliveredById: { type: string, nullable: true }
                receivedById: { type: string, nullable: true }
                pickerId: { type: string, nullable: true }
                dateRequested: { type: string, nullable: true, description: yyyy-MM-dd }
                requestedDeliveryDate: { type: string, nullable: true, description: yyyy-MM-dd }
                description: { type: string, nullable: true }
      responses:
        '200':
          $ref: '#/components/responses/RequisitionDetails'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ControllerNotFound'

  /api/requisitions/{id}/items:
    post:
      operationId: saveRequisitionItems
      summary: Sync requisition items (edit screen)
      description: >
        Mirrors the legacy RequisitionController.saveRequisitionItems action
        - the posted items replace the requisition's items; persisted items
        missing from the payload are deleted.
      parameters:
        - $ref: '#/components/parameters/requisitionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requisitionItems]
              properties:
                requisitionItems:
                  type: array
                  items:
                    type: object
                    required: [productId, quantity]
                    properties:
                      id: { type: string, nullable: true }
                      productId: { type: string }
                      quantity: { type: integer }
                      orderIndex: { type: integer, nullable: true }
      responses:
        '200':
          $ref: '#/components/responses/RequisitionDetails'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ControllerNotFound'

  /api/requisitions/{id}/pick:
    post:
      operationId: pickRequisition
      summary: Move a requisition to PICKING and return pick-screen data
      description: >
        Mirrors the legacy RequisitionController.pick action - requires a
        verified requisition, transitions it to PICKING (approving pending
        items), lazily creates the picklist, and returns the details plus
        the available bin locations per product.
      parameters:
        - $ref: '#/components/parameters/requisitionId'
      responses:
        '200':
          description: Requisition details plus picklist and available items.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, picklist, availableItems]
                    properties:
                      id:
                        $ref: '../components/common.yaml#/components/schemas/Id'
                      picklist:
                        type: object
                        required: [id]
                        properties:
                          id:
                            $ref: '../components/common.yaml#/components/schemas/Id'
                          picker:
                            $ref: '#/components/schemas/NullableNamedReference'
                          datePicked:
                            type: string
                            nullable: true
                      availableItems:
                        type: object
                        additionalProperties:
                          type: array
                          items:
                            type: object
                            properties:
                              inventoryItemId: { type: string, nullable: true }
                              lotNumber: { type: string, nullable: true }
                              expirationDate: { type: string, nullable: true }
                              binLocation:
                                $ref: '#/components/schemas/NullableNamedReference'
                              quantityAvailable: { type: number }
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ControllerNotFound'

  /api/requisitions/{id}/picklist:
    post:
      operationId: updateRequisitionPicklist
      summary: Update picklist picker/date picked (pick screen)
      description: >
        Mirrors the picklist branch of the legacy
        RequisitionController.saveDetails action.
      parameters:
        - $ref: '#/components/parameters/requisitionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pickerId: { type: string, nullable: true }
                datePicked: { type: string, nullable: true, description: yyyy-MM-dd }
      responses:
        '200':
          description: Updated picklist.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id]
                    properties:
                      id:
                        $ref: '../components/common.yaml#/components/schemas/Id'
                      picker:
                        $ref: '#/components/schemas/NullableNamedReference'
                      datePicked:
                        type: string
                        nullable: true
        '404':
          $ref: '#/components/responses/ControllerNotFound'

  /api/requisitions/{id}/picklistItems:
    post:
      operationId: updateRequisitionPicklistItems
      summary: Create/update/remove picklist items for a requisition item
      description: >
        Mirrors the legacy RequisitionController.addToPicklistItems action -
        quantity greater than zero creates or updates a picklist item, while
        zero or negative quantity removes an existing picklist item.
      parameters:
        - $ref: '#/components/parameters/requisitionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requisitionItemId, picklistItems]
              properties:
                requisitionItemId: { type: string }
                picklistItems:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: string, nullable: true }
                      inventoryItemId: { type: string, nullable: true }
                      binLocationId: { type: string, nullable: true }
                      quantity: { type: integer }
      responses:
        '200':
          $ref: '#/components/responses/RequisitionDetails'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ControllerNotFound'
components:
  securitySchemes:
    cookieAuth:
      $ref: '../components/common.yaml#/components/securitySchemes/cookieAuth'

  parameters:
    requisitionId:
      name: id
      in: path
      required: true
      schema:
        $ref: '../components/common.yaml#/components/schemas/Id'
      description: Requisition id.

  responses:
    ControllerNotFound:
      description: >
        Unknown requisition id. Rendered directly by the controller with
        errorCode and errorMessage.
      content:
        application/json:
          schema:
            type: object
            required: [errorCode, errorMessage]
            properties:
              errorCode:
                type: integer
                enum: [404]
              errorMessage:
                type: string

    ValidationError:
      description: Validation errors.
      content:
        application/json:
          schema:
            type: object
            required: [errorCode, errorMessage]
            properties:
              errorCode:
                type: integer
                enum: [400]
              errorMessage:
                type: string
              errors:
                type: array
                items:
                  type: string

    RequisitionDetails:
      description: Requisition details for the classic flow screens.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/RequisitionDetails'

  schemas:
    NamedReference:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: '../components/common.yaml#/components/schemas/Id'
        name:
          type: string
          nullable: true

    NullableNamedReference:
      type: object
      nullable: true
      required: [id, name]
      properties:
        id:
          $ref: '../components/common.yaml#/components/schemas/Id'
        name:
          type: string
          nullable: true

    RequisitionDetails:
      type: object
      required: [id, requestNumber, status, requisitionItems]
      properties:
        id:
          $ref: '../components/common.yaml#/components/schemas/Id'
        requestNumber:
          type: string
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        status:
          type: string
        type:
          type: string
          nullable: true
        commodityClass:
          type: string
          nullable: true
        origin:
          $ref: '#/components/schemas/NullableNamedReference'
        destination:
          $ref: '#/components/schemas/NullableNamedReference'
        requestedBy:
          $ref: '#/components/schemas/NullableNamedReference'
        createdBy:
          $ref: '#/components/schemas/NullableNamedReference'
        verifiedBy:
          $ref: '#/components/schemas/NullableNamedReference'
        checkedBy:
          $ref: '#/components/schemas/NullableNamedReference'
        dateRequested:
          type: string
          nullable: true
        requestedDeliveryDate:
          type: string
          nullable: true
        dateCreated:
          type: string
          nullable: true
        dateVerified:
          type: string
          nullable: true
        dateChecked:
          type: string
          nullable: true
        requisitionItems:
          type: array
          items:
            type: object
            required: [id, quantity, product, picklistItems]
            properties:
              id:
                $ref: '../components/common.yaml#/components/schemas/Id'
              status:
                type: string
                nullable: true
              orderIndex:
                type: integer
                nullable: true
              product:
                type: object
                properties:
                  id:
                    $ref: '../components/common.yaml#/components/schemas/Id'
                  productCode:
                    type: string
                  name:
                    type: string
                    nullable: true
                  unitOfMeasure:
                    type: string
                    nullable: true
              quantity:
                type: integer
              quantityApproved:
                type: integer
              quantityCanceled:
                type: integer
              quantityPicked:
                type: integer
              quantityRemaining:
                type: integer
              cancelReasonCode:
                type: string
                nullable: true
              cancelComments:
                type: string
                nullable: true
              isOriginal:
                type: boolean
              isSubstitution:
                type: boolean
              isSubstituted:
                type: boolean
              isChanged:
                type: boolean
              isCanceled:
                type: boolean
              isPending:
                type: boolean
              isApproved:
                type: boolean
              canEdit:
                type: boolean
              canUndoChanges:
                type: boolean
              parentRequisitionItem:
                type: object
                nullable: true
                properties:
                  id:
                    $ref: '../components/common.yaml#/components/schemas/Id'
              substitutionItem:
                $ref: '#/components/schemas/RelatedRequisitionItem'
              modificationItem:
                $ref: '#/components/schemas/RelatedRequisitionItem'
              picklistItems:
                type: array
                items:
                  type: object
                  required: [id, quantity]
                  properties:
                    id:
                      $ref: '../components/common.yaml#/components/schemas/Id'
                    quantity:
                      type: integer
                    inventoryItemId:
                      type: string
                      nullable: true
                    lotNumber:
                      type: string
                      nullable: true
                    binLocation:
                      $ref: '#/components/schemas/NullableNamedReference'
                    isSubstitution:
                      type: boolean
                    product:
                      type: object
                      properties:
                        id:
                          $ref: '../components/common.yaml#/components/schemas/Id'
                        productCode:
                          type: string
                          nullable: true
                        name:
                          type: string
                          nullable: true
                        unitOfMeasure:
                          type: string
                          nullable: true

    RelatedRequisitionItem:
      type: object
      nullable: true
      properties:
        id:
          $ref: '../components/common.yaml#/components/schemas/Id'
        quantity:
          type: integer
        quantityApproved:
          type: integer
        product:
          type: object
          properties:
            id:
              $ref: '../components/common.yaml#/components/schemas/Id'
            productCode:
              type: string
              nullable: true
            name:
              type: string
              nullable: true
            unitOfMeasure:
              type: string
              nullable: true
