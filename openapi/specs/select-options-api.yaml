openapi: 3.0.3
info:
  title: OpenBoxes - SelectOptionsApiController
  description: >
    Read-only dropdown/filter option lists handled by
    org.pih.warehouse.api.SelectOptionsApiController, routed via the explicit
    per-option mappings ("/api/categoryOptions", "/api/catalogOptions",
    "/api/productGroupOptions", "/api/tagOptions", "/api/glAccountOptions",
    "/api/paymentTermOptions", "/api/users", "/api/preferenceTypeOptions",
    "/api/ratingTypeCodeOptions", "/api/handlingRequirementsOptions",
    "/api/productTypeOptions", "/api/documentTypeOptions",
    "/api/productAssociationTypeCodeOptions" and
    "/api/stockMovements/shipmentStatusCodes", "/api/glAccountTypeOptions",
    "/api/locationTypeCodeOptions", "/api/partyTypeOptions",
    "/api/organizationRoleTypeOptions", "/api/roleTypeOptions",
    "/api/partyOptions").
    All endpoints are GET-only and
    render an option list under a "data" envelope; the option shape varies
    slightly per endpoint (some include "value" and/or "variant").
  version: 0.1.0
servers:
  - url: http://localhost:8080/openboxes
    description: Local Docker baseline (docs/migration/RUNNING_LOCALLY.md)
security:
  - cookieAuth: []
paths:
  /api/glAccountTypeOptions:
    get:
      operationId: listGlAccountTypeOptions
      summary: GL account type options
      description: >
        Returns all GlAccountType records that have a code, sorted by code,
        as {id, label} pairs (label is the code). Added in Phase 2 (Batch 26)
        for the React glAccount form.
      responses:
        '200':
          $ref: '#/components/responses/IdLabelOptionsOk'
  /api/glAccountTypeCodeOptions:
    get:
      operationId: glAccountTypeCodeOptions
      summary: GL account type code (enum) options
      description: >
        Returns the GlAccountTypeCode enum values (ASSET, EXPENSE, LIABILITY,
        EQUITY, REVENUE) as {id, value, label} triples, all equal to the enum
        name. Added in Phase 2 (Batch 27) for the React glAccountType form.
      responses:
        '200':
          description: Option list.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, value, label]
                      properties:
                        id:
                          type: string
                        value:
                          type: string
                        label:
                          type: string
  /api/orderAdjustmentTypeCodeOptions:
    get:
      operationId: orderAdjustmentTypeCodeOptions
      summary: Order adjustment type code (enum) options
      description: >
        Returns the OrderAdjustmentTypeCode enum values as {id, value, label}
        triples, all equal to the enum name. Added in Phase 2 (Batch 29) for
        the React orderAdjustmentType form.
      responses:
        '200':
          description: Option list.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, value, label]
                      properties:
                        id:
                          type: string
                        value:
                          type: string
                        label:
                          type: string
  /api/locationTypeCodeOptions:
    get:
      operationId: listLocationTypeCodeOptions
      summary: Location type code options
      description: >
        Returns every LocationTypeCode enum value as {id, label} pairs (both
        the enum name). Added in Phase 2 (Batch 32) for the React
        locationType form.
      responses:
        '200':
          $ref: '#/components/responses/IdLabelOptionsOk'
  /api/partyTypeOptions:
    get:
      operationId: listPartyTypeOptions
      summary: Party type options
      description: >
        Returns all PartyType records as {id, label} pairs (label is the
        party type name). Added in Phase 2 (Batch 33) for the React
        organization form.
      responses:
        '200':
          $ref: '#/components/responses/IdLabelOptionsOk'
  /api/organizationRoleTypeOptions:
    get:
      operationId: listOrganizationRoleTypeOptions
      summary: Organization role type options
      description: >
        Returns the RoleType.listOrganizationRoleTypes() enum values (e.g.
        ROLE_SUPPLIER, ROLE_MANUFACTURER) as {id, label} pairs (both the
        enum name). Added in Phase 2 (Batch 33) for the React organization
        list filters.
      responses:
        '200':
          $ref: '#/components/responses/IdLabelOptionsOk'
  /api/roleTypeOptions:
    get:
      operationId: listRoleTypeOptions
      summary: Role type options
      description: >
        Returns all RoleType enum values as {id, label} pairs (both the enum
        name). Added in Phase 2 (Batch 34) for the React party role form.
      responses:
        '200':
          $ref: '#/components/responses/IdLabelOptionsOk'
  /api/partyOptions:
    get:
      operationId: listPartyOptions
      summary: Party options
      description: >
        Returns all Party records as {id, label, partyType} triples (label is
        the party id, matching the legacy Party.toString(); partyType is the
        party type name). Added in Phase 2 (Batch 34) for the React party
        role form.
      responses:
        '200':
          description: Option list.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, label]
                      properties:
                        id:
                          $ref: '../components/common.yaml#/components/schemas/Id'
                        label:
                          type: string
                        partyType:
                          type: string
                          nullable: true
  /api/glAccountOptions:
    get:
      operationId: glAccountOptions
      summary: GL account options (code + name labels)
      description: >
        Options for GL accounts that have a code; label is "<code> - <name>".
        The seeded demo dataset has none, so "data" is usually empty.
      responses:
        '200':
          $ref: '#/components/responses/IdLabelOptionsOk'
  /api/productGroupOptions:
    get:
      operationId: productGroupOptions
      summary: Product group options
      responses:
        '200':
          $ref: '#/components/responses/IdLabelOptionsOk'
  /api/catalogOptions:
    get:
      operationId: catalogOptions
      summary: Product catalog options
      description: >
        Label is "<name> (<item count>)" unless hideNumbers=true, in which
        case it is the bare catalog name.
      parameters:
        - $ref: '#/components/parameters/hideNumbers'
      responses:
        '200':
          $ref: '#/components/responses/IdLabelOptionsOk'
  /api/categoryOptions:
    get:
      operationId: categoryOptions
      summary: Product category options
      description: >
        Label is the category hierarchy joined with " > " (ROOT is excluded
        from the rendered hierarchy string).
      responses:
        '200':
          $ref: '#/components/responses/IdLabelOptionsOk'
  /api/tagOptions:
    get:
      operationId: tagOptions
      summary: Product tag options
      description: >
        Label is "<tag> (<product count>)" unless hideNumbers=true, in which
        case it is the bare tag.
      parameters:
        - $ref: '#/components/parameters/hideNumbers'
      responses:
        '200':
          $ref: '#/components/responses/IdLabelOptionsOk'
  /api/paymentTermOptions:
    get:
      operationId: paymentTermOptions
      summary: Payment term options
      description: Options include "value" (same as "id").
      responses:
        '200':
          $ref: '#/components/responses/IdLabelValueOptionsOk'
  /api/users:
    get:
      operationId: usersOptions
      summary: List users (for user pickers)
      description: >
        Backed by UserService.findUsers. Accepts optional filters:
        roleTypes (repeatable), location (defaults to the session warehouse
        when roleTypes is given), status, searchTerm. Renders user summary
        maps, not the id/label option shape used by the other endpoints.
      parameters:
        - name: roleTypes
          in: query
          required: false
          schema:
            type: string
          description: Role type name filter (may be repeated).
      responses:
        '200':
          description: User summaries.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserOption'
  /api/preferenceTypeOptions:
    get:
      operationId: preferenceTypeOptions
      summary: Product supplier preference type options
      description: >
        Renders the PreferenceType domain records as id/label/value options.
        includeMultiple=true and includeNone=true prepend the synthetic
        MULTIPLE and NONE options.
      parameters:
        - name: includeMultiple
          in: query
          required: false
          schema:
            type: boolean
        - name: includeNone
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          $ref: '#/components/responses/IdLabelValueOptionsOk'
  /api/ratingTypeCodeOptions:
    get:
      operationId: ratingTypeCodeOptions
      summary: Rating type code options (RatingTypeCode enum)
      responses:
        '200':
          $ref: '#/components/responses/IdLabelValueOptionsOk'
  /api/handlingRequirementsOptions:
    get:
      operationId: handlingRequirementsOptions
      summary: Handling requirement options (fixed ProductField subset)
      description: >
        Always the four options COLD_CHAIN, CONTROLLED_SUBSTANCE,
        HAZARDOUS_MATERIAL and RECONDITIONED.
      responses:
        '200':
          $ref: '#/components/responses/IdLabelValueOptionsOk'
  /api/productTypeOptions:
    get:
      operationId: productTypeOptions
      summary: Product type options (React product/edit screen)
      description: >
        Renders ProductType records with a non-empty name as id/label
        options, sorted by name.
      responses:
        '200':
          $ref: '#/components/responses/IdLabelOptionsOk'
  /api/documentTypeOptions:
    get:
      operationId: documentTypeOptions
      summary: Document type options (React product/addDocument screen)
      description: >
        Renders non-template DocumentType records as id/label options,
        mirroring the legacy product/addDocument type dropdown.
      responses:
        '200':
          $ref: '#/components/responses/IdLabelOptionsOk'
  /api/orderAdjustmentTypeOptions:
    get:
      operationId: orderAdjustmentTypeOptions
      summary: Order adjustment type options (React order adjustment screen)
      description: >
        Renders all OrderAdjustmentType records as id/value/label options,
        mirroring the legacy selectOrderAdjustmentTypes tag.
      responses:
        '200':
          $ref: '#/components/responses/IdLabelValueOptionsOk'
  /api/budgetCodeOptions:
    get:
      operationId: budgetCodeOptions
      summary: Budget code options (React order adjustment screen)
      description: >
        Renders BudgetCode records (active only by default) as id/value/label
        options labeled with the budget code, mirroring the legacy
        selectBudgetCode tag.
      parameters:
        - name: active
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        '200':
          $ref: '#/components/responses/IdLabelValueOptionsOk'
  /api/orderStatusOptions:
    get:
      operationId: orderStatusOptions
      summary: Order status options (React order list screen)
      description: >
        Renders the OrderStatus enum values as id/value/label options with
        localized labels.
      responses:
        '200':
          $ref: '#/components/responses/IdLabelValueOptionsOk'
  /api/orderSummaryStatusOptions:
    get:
      operationId: orderSummaryStatusOptions
      summary: Grouped OrderSummaryStatus options (React order summary screens)
      description: >
        Renders the OrderSummaryStatus enum groupings (order, shipment,
        receipt, payment and derived statuses) used by the legacy order
        summary list filters.
      responses:
        '200':
          description: Grouped status options.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required:
                      - orderStatuses
                      - shipmentStatuses
                      - receiptStatuses
                      - paymentStatuses
                      - derivedStatuses
                    properties:
                      orderStatuses:
                        type: array
                        items:
                          $ref: '#/components/schemas/IdLabelValueOption'
                      shipmentStatuses:
                        type: array
                        items:
                          $ref: '#/components/schemas/IdLabelValueOption'
                      receiptStatuses:
                        type: array
                        items:
                          $ref: '#/components/schemas/IdLabelValueOption'
                      paymentStatuses:
                        type: array
                        items:
                          $ref: '#/components/schemas/IdLabelValueOption'
                      derivedStatuses:
                        type: array
                        items:
                          $ref: '#/components/schemas/IdLabelValueOption'
  /api/productAssociationTypeCodeOptions:
    get:
      operationId: productAssociationTypeCodeOptions
      summary: Product association type code (enum) options
      description: >
        Returns the ProductAssociationTypeCode enum values in sortOrder as
        {id, value, label} triples (id/value are the enum name, label is the
        localized enum.ProductAssociationTypeCode.* message). Added in
        Phase 2 (Batch 9) for the React productAssociation screens.
      responses:
        '200':
          description: Option list.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, value, label]
                      properties:
                        id:
                          type: string
                        value:
                          type: string
                        label:
                          type: string
  /api/stockMovements/shipmentStatusCodes:
    get:
      operationId: shipmentStatusCodesOptions
      summary: Shipment status code options
      description: >
        Options additionally carry a display "variant". excludedStatuses
        removes the given status codes from the list.
      parameters:
        - name: excludedStatuses
          in: query
          required: false
          schema:
            type: string
          description: Status code to exclude (may be repeated).
      responses:
        '200':
          description: Shipment status options.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/IdLabelValueOption'
                        - type: object
                          properties:
                            variant:
                              type: string
components:
  parameters:
    hideNumbers:
      name: hideNumbers
      in: query
      required: false
      schema:
        type: boolean
      description: When true, omit the item count from the label.
  responses:
    IdLabelOptionsOk:
      description: Option list.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items:
                  $ref: '#/components/schemas/IdLabelOption'
    IdLabelValueOptionsOk:
      description: Option list (with value).
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items:
                  $ref: '#/components/schemas/IdLabelValueOption'
  schemas:
    IdLabelOption:
      type: object
      required: [id, label]
      properties:
        id:
          $ref: '../components/common.yaml#/components/schemas/Id'
        label:
          type: string
      additionalProperties: true
    IdLabelValueOption:
      type: object
      required: [id, label, value]
      properties:
        id:
          type: string
          description: Domain id or enum name, depending on the endpoint.
        label:
          type: string
        value:
          type: string
      additionalProperties: true
    UserOption:
      type: object
      required: [id, name, username]
      properties:
        id:
          $ref: '../components/common.yaml#/components/schemas/Id'
        name:
          type: string
          nullable: true
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        username:
          type: string
        roles:
          type: array
          items:
            type: string
      additionalProperties: true
  securitySchemes:
    cookieAuth:
      $ref: '../components/common.yaml#/components/securitySchemes/cookieAuth'
