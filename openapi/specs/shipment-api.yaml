openapi: 3.0.3
info:
  title: OpenBoxes - ShipmentApiController
  description: >
    Create-shipment wizard endpoints handled by
    org.pih.warehouse.api.ShipmentApiController, added for the React
    migration of the legacy createShipmentWorkflow webflow screens
    (enterShipmentDetails, enterTrackingDetails, enterContainerDetails,
    pickShipmentItems, sendShipment). Routed via the "/api/shipments/..."
    URL mappings.
  version: 0.1.0
servers:
  - url: http://localhost:8080/openboxes
    description: Local Docker baseline (docs/migration/RUNNING_LOCALLY.md)
security:
  - cookieAuth: []
paths:
  /api/shipments/wizardOptions:
    get:
      operationId: getShipmentWizardOptions
      summary: Options for the create shipment wizard selects
      description: >
        Shipment types, allowed origins/destinations, shippers and container
        types - mirrors the select taglibs used by the legacy wizard GSPs.
      responses:
        '200':
          description: Wizard options.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [shipmentTypes, origins, destinations, shippers, containerTypes]
                    properties:
                      shipmentTypes:
                        type: array
                        items:
                          $ref: '#/components/schemas/NamedReference'
                      origins:
                        type: array
                        items:
                          $ref: '#/components/schemas/LocationOption'
                      destinations:
                        type: array
                        items:
                          $ref: '#/components/schemas/LocationOption'
                      shippers:
                        type: array
                        items:
                          $ref: '#/components/schemas/NamedReference'
                      containerTypes:
                        type: array
                        items:
                          $ref: '#/components/schemas/NamedReference'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/shipments:
    get:
      operationId: getShipmentList
      summary: Shipments for the shipment list screen
      description: >
        Mirrors the legacy ShipmentController.list() filters - incoming lists
        shipments into the current warehouse, outgoing lists shipments out of
        it.
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [incoming, outgoing]
        - name: terms
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: shipmentType
          in: query
          schema:
            type: string
        - name: origin
          in: query
          schema:
            type: string
        - name: destination
          in: query
          schema:
            type: string
        - name: max
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Shipment list rows.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [shipments, incoming, isSuperuser]
                    properties:
                      shipments:
                        type: array
                        items:
                          $ref: '#/components/schemas/ShipmentListRow'
                      incoming:
                        type: boolean
                      origin:
                        type: string
                        nullable: true
                      destination:
                        type: string
                        nullable: true
                      isSuperuser:
                        type: boolean
        '400':
          $ref: '#/components/responses/ValidationError'
    post:
      operationId: createShipment
      summary: Create a shipment (wizard details step)
      description: >
        Mirrors the enterShipmentDetails transition of the legacy webflow for
        a brand new shipment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentDetailsRequest'
      responses:
        '201':
          $ref: '#/components/responses/WizardDetails'
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/shipments/{id}:
    get:
      operationId: readShipment
      summary: Read shipment details and workflow metadata
      parameters:
        - $ref: '#/components/parameters/shipmentId'
      responses:
        '200':
          $ref: '#/components/responses/WizardDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ControllerNotFound'

  /api/shipments/{id}/details:
    post:
      operationId: saveShipmentDetails
      summary: Update shipment details (wizard details step)
      parameters:
        - $ref: '#/components/parameters/shipmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentDetailsRequest'
      responses:
        '200':
          $ref: '#/components/responses/WizardDetails'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ControllerNotFound'

  /api/shipments/{id}/tracking:
    post:
      operationId: saveShipmentTracking
      summary: Update tracking details (wizard tracking step)
      description: >
        Mirrors the enterTrackingDetails transition, including the manual
        binding of the shipper (nested in shipmentMethod) and the reference
        numbers declared on the shipment workflow. A null shipperId removes
        the shipment method entirely, like the legacy bindShipper.
      parameters:
        - $ref: '#/components/parameters/shipmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                carrierId:
                  type: string
                  nullable: true
                shipperId:
                  type: string
                  nullable: true
                trackingNumber:
                  type: string
                  nullable: true
                recipientId:
                  type: string
                  nullable: true
                referenceNumbers:
                  type: object
                  additionalProperties:
                    type: string
                    nullable: true
                statedValue:
                  type: number
                  nullable: true
                totalValue:
                  type: number
                  nullable: true
                additionalInformation:
                  type: string
                  nullable: true
      responses:
        '200':
          $ref: '#/components/responses/WizardDetails'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ControllerNotFound'

  /api/shipments/{id}/packing:
    get:
      operationId: getShipmentPacking
      summary: Containers and items for the wizard packing step
      parameters:
        - $ref: '#/components/parameters/shipmentId'
      responses:
        '200':
          description: Wizard details plus containers and unpacked items.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/WizardDetails'
                      - type: object
                        required: [containers, unpackedItems]
                        properties:
                          containers:
                            type: array
                            items:
                              $ref: '#/components/schemas/ContainerDetails'
                          unpackedItems:
                            type: array
                            items:
                              $ref: '#/components/schemas/ItemDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ControllerNotFound'

  /api/shipments/{id}/containers:
    post:
      operationId: createShipmentContainers
      summary: Add containers to a shipment (wizard packing step)
      description: >
        Mirrors the addContainers flow event - creates one container per line
        of containerText for the given container type, optionally nested
        under parentContainerId.
      parameters:
        - $ref: '#/components/parameters/shipmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [containerTypeId, containerText]
              properties:
                containerTypeId:
                  type: string
                containerText:
                  type: string
                parentContainerId:
                  type: string
                  nullable: true
      responses:
        '201':
          $ref: '#/components/responses/ShipmentIdData'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ControllerNotFound'

  /api/shipments/{id}/containers/{containerId}:
    delete:
      operationId: deleteShipmentContainer
      summary: Delete a container (wizard packing step)
      description: >
        Mirrors the deleteContainer / deleteContainersAndItems flow events.
        With deleteItems=false the request fails if the container still
        contains items; with deleteItems=true the items are deleted too.
      parameters:
        - $ref: '#/components/parameters/shipmentId'
        - name: containerId
          in: path
          required: true
          schema:
            $ref: '../components/common.yaml#/components/schemas/Id'
        - name: deleteItems
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '200':
          $ref: '#/components/responses/ShipmentIdData'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ControllerNotFound'

  /api/shipments/{id}/items:
    post:
      operationId: addShipmentItem
      summary: Add an inventory item to a shipment (wizard packing step)
      parameters:
        - $ref: '#/components/parameters/shipmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inventoryItemId, quantity]
              properties:
                inventoryItemId:
                  type: string
                containerId:
                  type: string
                  nullable: true
                quantity:
                  type: integer
      responses:
        '201':
          $ref: '#/components/responses/ShipmentIdData'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ControllerNotFound'

  /api/shipments/{id}/items/{itemId}:
    post:
      operationId: updateShipmentItem
      summary: Update a shipment item's quantity and/or container
      parameters:
        - $ref: '#/components/parameters/shipmentId'
        - $ref: '#/components/parameters/itemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: integer
                containerId:
                  type: string
                  nullable: true
      responses:
        '200':
          $ref: '#/components/responses/ItemData'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ControllerNotFound'
    delete:
      operationId: deleteShipmentItem
      summary: Delete a shipment item
      parameters:
        - $ref: '#/components/parameters/shipmentId'
        - $ref: '#/components/parameters/itemId'
      responses:
        '200':
          $ref: '#/components/responses/ShipmentIdData'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/ControllerNotFound'

  /api/shipments/{id}/items/{itemId}/pick:
    post:
      operationId: pickShipmentItem
      summary: Pick a shipment item (wizard picking step)
      description: >
        Mirrors the pickShipmentItem flow event - assigns the inventory item,
        bin location and quantity of a picklist row.
      parameters:
        - $ref: '#/components/parameters/shipmentId'
        - $ref: '#/components/parameters/itemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inventoryItemId, quantity]
              properties:
                inventoryItemId:
                  type: string
                binLocationId:
                  type: string
                  nullable: true
                quantity:
                  type: integer
      responses:
        '200':
          $ref: '#/components/responses/ItemData'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ControllerNotFound'

  /api/shipments/{id}/items/{itemId}/split:
    post:
      operationId: splitShipmentItem
      summary: Split a shipment item (wizard picking step)
      description: >
        Mirrors the splitShipmentItem2 flow event - clones the item with
        quantity zero so a second bin/lot can be picked.
      parameters:
        - $ref: '#/components/parameters/shipmentId'
        - $ref: '#/components/parameters/itemId'
      responses:
        '200':
          $ref: '#/components/responses/ItemData'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ControllerNotFound'

  /api/shipments/{id}/picklist:
    get:
      operationId: getShipmentPicklist
      summary: Picklist data for the wizard picking and sending steps
      description: >
        Shipment items in picklist order plus, for each product, the quantity
        available in each bin location of the session warehouse.
      parameters:
        - $ref: '#/components/parameters/shipmentId'
      responses:
        '200':
          description: Wizard details plus picklist data.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/WizardDetails'
                      - type: object
                        required: [shipmentItems, binLocationsByProduct, isOrigin]
                        properties:
                          shipmentItems:
                            type: array
                            items:
                              $ref: '#/components/schemas/ItemDetails'
                          binLocationsByProduct:
                            type: object
                            additionalProperties:
                              type: array
                              items:
                                type: object
                                properties:
                                  binLocation:
                                    $ref: '#/components/schemas/NullableNamedReference'
                                  inventoryItem:
                                    type: object
                                    nullable: true
                                    properties:
                                      id:
                                        $ref: '../components/common.yaml#/components/schemas/Id'
                                      lotNumber:
                                        type: string
                                        nullable: true
                                      expirationDate:
                                        type: string
                                        nullable: true
                                  quantity:
                                    type: integer
                          isOrigin:
                            type: boolean
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ControllerNotFound'

  /api/shipments/{id}/validatePicklist:
    post:
      operationId: validateShipmentPicklist
      summary: Validate the shipment's picklist (wizard picking step)
      parameters:
        - $ref: '#/components/parameters/shipmentId'
      responses:
        '200':
          description: Validation result (valid flag plus error messages).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [valid, errors]
                    properties:
                      valid:
                        type: boolean
                      errors:
                        type: array
                        items:
                          type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ControllerNotFound'

  /api/shipments/{id}/clearPicklist:
    post:
      operationId: clearShipmentPicklist
      summary: Clear the shipment's picklist (superusers only)
      parameters:
        - $ref: '#/components/parameters/shipmentId'
      responses:
        '200':
          $ref: '#/components/responses/ShipmentIdData'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ControllerNotFound'

  /api/shipments/{id}/send:
    post:
      operationId: sendShipment
      summary: Send the shipment (wizard sending step)
      description: >
        Mirrors the sendShipmentAction flow state - validates the picklist,
        sends the shipment (debiting stock at the origin) and triggers the
        notification emails to the selected recipients. Cannot be undone.
      parameters:
        - $ref: '#/components/parameters/shipmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actualShippingDate:
                  type: string
                  nullable: true
                  description: >-
                    Format yyyy-MM-dd HH:mm, optionally followed by a UTC
                    offset (e.g. "2024-01-01 12:00 +02:00"). When an offset is
                    present the date is validated to not be in the future.
                    Defaults to now.
                comments:
                  type: string
                  nullable: true
                debitStockOnSend:
                  type: boolean
                  default: true
                  description: >
                    Whether sending debits stock from the origin warehouse
                    (mirrors the legacy debitStockOnSend flag).
                emailRecipientIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          $ref: '#/components/responses/WizardDetails'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ControllerNotFound'

  # Batch 22: classic shipping screens (shipment/list, showDetails,
  # showPackingList, receiveShipment, sendShipment, shipmentItem/create)

  /api/shipments/listOptions:
    get:
      operationId: getShipmentListOptions
      summary: Filter options for the shipment list screen
      responses:
        '200':
          description: Shipment list filter options.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [shipmentTypes, statusCodes, locations]
                    properties:
                      shipmentTypes:
                        type: array
                        items:
                          $ref: '#/components/schemas/NamedReference'
                      statusCodes:
                        type: array
                        items:
                          type: string
                      locations:
                        type: array
                        items:
                          $ref: '#/components/schemas/NamedReference'

  /api/shipments/bulkAction:
    post:
      operationId: shipmentBulkAction
      summary: Bulk actions from the shipment list screen (superuser only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, shipmentIds]
              properties:
                action:
                  type: string
                  enum: [delete, receive, markAsReceived, rollback]
                shipmentIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Bulk action result.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [success, count]
                    properties:
                      success:
                        type: boolean
                      count:
                        type: integer
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/shipments/{id}/showDetails:
    get:
      operationId: getShipmentShowDetails
      summary: Data for the shipment showDetails screen
      description: >
        Wizard details plus the contents/receipt/documents/comments/events/
        transactions/tracking tab data of the legacy showDetails GSP.
      parameters:
        - $ref: '#/components/parameters/shipmentId'
      responses:
        '200':
          description: Shipment show-details data.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/WizardDetails'
                      - type: object
                        required: [shipmentItems, documents, comments, events, transactions]
                        properties:
                          wasReceived:
                            type: boolean
                          isReceiveAllowed:
                            type: boolean
                          isSendAllowed:
                            type: boolean
                          actualDeliveryDate:
                            type: string
                            nullable: true
                          totalWeightInPounds:
                            type: number
                            nullable: true
                          trackingUrl:
                            type: string
                            nullable: true
                          shipmentItems:
                            type: array
                            items:
                              $ref: '#/components/schemas/ShowItemDetails'
                          receipt:
                            $ref: '#/components/schemas/ReceiptDetails'
                          documents:
                            type: array
                            items:
                              type: object
                          comments:
                            type: array
                            items:
                              type: object
                          events:
                            type: array
                            items:
                              type: object
                          transactions:
                            type: array
                            items:
                              type: object
                          eventTypes:
                            type: array
                            items:
                              $ref: '#/components/schemas/NamedReference'
                          eventLocations:
                            type: array
                            items:
                              $ref: '#/components/schemas/NamedReference'
        '404':
          $ref: '#/components/responses/ControllerNotFound'

  /api/shipments/{id}/packingList:
    get:
      operationId: getShipmentPackingList
      summary: Data for the shipment showPackingList screen
      parameters:
        - $ref: '#/components/parameters/shipmentId'
      responses:
        '200':
          description: Packing list data.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, shipmentNumber, shipmentItems]
                    properties:
                      id:
                        $ref: '../components/common.yaml#/components/schemas/Id'
                      name:
                        type: string
                        nullable: true
                      shipmentNumber:
                        type: string
                        nullable: true
                      status:
                        type: string
                        nullable: true
                      origin:
                        type: string
                        nullable: true
                      destination:
                        type: string
                        nullable: true
                      wasReceived:
                        type: boolean
                      shipmentItems:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/ShowItemDetails'
                            - type: object
                              properties:
                                containerDetails:
                                  type: object
                                  nullable: true
        '404':
          $ref: '#/components/responses/ControllerNotFound'

  /api/shipments/{id}/comments:
    post:
      operationId: addShipmentComment
      summary: Add a comment to a shipment
      parameters:
        - $ref: '#/components/parameters/shipmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment:
                  type: string
                recipientId:
                  type: string
                  nullable: true
      responses:
        '200':
          $ref: '#/components/responses/SuccessData'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ControllerNotFound'

  /api/shipments/{id}/events:
    post:
      operationId: addShipmentEvent
      summary: Add an event to a shipment
      parameters:
        - $ref: '#/components/parameters/shipmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventTypeId]
              properties:
                eventTypeId:
                  type: string
                eventLocationId:
                  type: string
                  nullable: true
                eventDate:
                  type: string
                  nullable: true
                  description: Format yyyy-MM-dd HH:mm; defaults to now.
      responses:
        '200':
          $ref: '#/components/responses/SuccessData'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ControllerNotFound'

  /api/shipments/{id}/receipt:
    get:
      operationId: getShipmentReceipt
      summary: Pending or existing receipt for the receive shipment screen
      parameters:
        - $ref: '#/components/parameters/shipmentId'
      responses:
        '200':
          description: Receipt data with bin location options.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [shipment, receipt, isDestination, hasBinLocationSupport, binLocations]
                    properties:
                      shipment:
                        $ref: '#/components/schemas/WizardDetails'
                      receipt:
                        $ref: '#/components/schemas/ReceiptDetails'
                      isDestination:
                        type: boolean
                      hasBinLocationSupport:
                        type: boolean
                      binLocations:
                        type: array
                        items:
                          $ref: '#/components/schemas/NamedReference'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ControllerNotFound'
    post:
      operationId: saveShipmentReceipt
      summary: Save the receipt or receive the shipment
      parameters:
        - $ref: '#/components/parameters/shipmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [save, saveAndExit, receiveShipment]
                actualDeliveryDate:
                  type: string
                  nullable: true
                  description: Format yyyy-MM-dd HH:mm.
                recipientId:
                  type: string
                  nullable: true
                comment:
                  type: string
                  nullable: true
                receiptItems:
                  type: array
                  items:
                    type: object
                    required: [id]
                    properties:
                      id:
                        type: string
                      quantityReceived:
                        type: integer
                        nullable: true
                      binLocationId:
                        type: string
                        nullable: true
                      comment:
                        type: string
                        nullable: true
      responses:
        '200':
          description: Receipt saved (and shipment optionally received).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, received]
                    properties:
                      id:
                        $ref: '../components/common.yaml#/components/schemas/Id'
                      received:
                        type: boolean
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ControllerNotFound'
    delete:
      operationId: deleteShipmentReceipt
      summary: Delete the pending receipt
      parameters:
        - $ref: '#/components/parameters/shipmentId'
      responses:
        '200':
          $ref: '#/components/responses/ShipmentIdData'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ControllerNotFound'

  /api/shipments/{id}/receipt/items/{receiptItemId}:
    delete:
      operationId: deleteShipmentReceiptItem
      summary: Delete a receipt item
      parameters:
        - $ref: '#/components/parameters/shipmentId'
        - $ref: '#/components/parameters/receiptItemId'
      responses:
        '200':
          $ref: '#/components/responses/ShipmentIdData'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ControllerNotFound'

  /api/shipments/{id}/receipt/items/{receiptItemId}/split:
    post:
      operationId: splitShipmentReceiptItem
      summary: Split a receipt item so it can be received into two bins
      parameters:
        - $ref: '#/components/parameters/shipmentId'
        - $ref: '#/components/parameters/receiptItemId'
      responses:
        '200':
          $ref: '#/components/responses/ShipmentIdData'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ControllerNotFound'

  /api/shipments/{id}/receipt/items/{receiptItemId}/putawayLocations:
    get:
      operationId: getReceiptItemPutawayLocations
      summary: Bin locations with quantity on hand for a receipt item's product
      parameters:
        - $ref: '#/components/parameters/shipmentId'
        - $ref: '#/components/parameters/receiptItemId'
      responses:
        '200':
          description: Putaway locations.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        binLocation:
                          type: string
                          nullable: true
                        lotNumber:
                          type: string
                          nullable: true
                        quantity:
                          type: number
                          nullable: true
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ControllerNotFound'

  /api/shipmentItems/createOptions:
    get:
      operationId: getShipmentItemCreateOptions
      summary: Options for the admin shipmentItem/create screen
      responses:
        '200':
          description: Create options.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [shipments, products, recipients]
                    properties:
                      shipments:
                        type: array
                        items:
                          $ref: '#/components/schemas/NamedReference'
                      containers:
                        type: array
                        items:
                          $ref: '#/components/schemas/NamedReference'
                      products:
                        type: array
                        items:
                          type: object
                      inventoryItems:
                        type: array
                        items:
                          $ref: '#/components/schemas/NamedReference'
                      recipients:
                        type: array
                        items:
                          $ref: '#/components/schemas/NamedReference'
                      donors:
                        type: array
                        items:
                          $ref: '#/components/schemas/NamedReference'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/shipmentItems:
    post:
      operationId: createShipmentItem
      summary: Create a standalone shipment item (admin screen)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shipmentId, productId, quantity]
              properties:
                shipmentId:
                  type: string
                containerId:
                  type: string
                  nullable: true
                productId:
                  type: string
                lotNumber:
                  type: string
                  nullable: true
                expirationDate:
                  type: string
                  nullable: true
                quantity:
                  type: integer
                recipientId:
                  type: string
                  nullable: true
                inventoryItemId:
                  type: string
                  nullable: true
                donorId:
                  type: string
                  nullable: true
      responses:
        '201':
          $ref: '#/components/responses/ItemData'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/shipments/{id}/outboundReturnPrint:
    get:
      operationId: getOutboundReturnPrintData
      summary: Print data for the outbound return delivery note
      description: >-
        Returns the shipment header, addresses, notes and shipment items (with
        matching positive-quantity receipt items) that the legacy
        deliveryNote/printOutboundReturn.gsp screen rendered. Shipment items
        are sorted by product name. Returns 404 with an `errorMessage` body
        when the shipment does not exist.
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Outbound return print data
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/OutboundReturnPrintData'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthorized'
  /api/shipments/{id}/goodsReceiptNotePrint:
    get:
      operationId: getGoodsReceiptNotePrintData
      summary: Print data for the goods receipt note
      description: >-
        Returns the shipment header, receipts and shipment items (each with
        its receipt items) that the legacy goodsReceiptNote/print.gsp screen
        rendered. Only shipment items that have receipt items are included;
        items are in shipment sort order and receipt items are ordered with
        split items first (the legacy _body.gsp sort). `status` is the localized shipment status display
        name. Returns 404 with an `errorMessage` body when the shipment does
        not exist.
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Goods receipt note print data
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/GoodsReceiptNotePrintData'
        '404':
          $ref: '../components/common.yaml#/components/responses/NotFound'
        '401':
          $ref: '../components/common.yaml#/components/responses/Unauthorized'
components:
  securitySchemes:
    cookieAuth:
      $ref: '../components/common.yaml#/components/securitySchemes/cookieAuth'

  parameters:
    id:
      name: id
      in: path
      required: true
      description: Shipment id
      schema:
        $ref: '../components/common.yaml#/components/schemas/Id'
    shipmentId:
      name: id
      in: path
      required: true
      schema:
        $ref: '../components/common.yaml#/components/schemas/Id'
      description: Shipment id.

    itemId:
      name: itemId
      in: path
      required: true
      schema:
        $ref: '../components/common.yaml#/components/schemas/Id'
      description: Shipment item id.

    receiptItemId:
      name: receiptItemId
      in: path
      required: true
      schema:
        $ref: '../components/common.yaml#/components/schemas/Id'
      description: Receipt item id.

  responses:
    Forbidden:
      description: The user does not have the role required for this action.
      content:
        application/json:
          schema:
            type: object
            required: [errorCode, errorMessage]
            properties:
              errorCode:
                type: integer
                enum: [403]
              errorMessage:
                type: string
    ControllerNotFound:
      description: >
        Unknown shipment (or container/item) id. Rendered directly by the
        controller with errorCode and errorMessage.
      content:
        application/json:
          schema:
            type: object
            required: [errorCode, errorMessage]
            properties:
              errorCode:
                type: integer
                enum: [404]
              errorMessage:
                type: string

    ValidationError:
      description: Validation or business errors.
      content:
        application/json:
          schema:
            type: object
            required: [errorCode, errorMessage]
            properties:
              errorCode:
                type: integer
                enum: [400]
              errorMessage:
                type: string
                nullable: true
              errors:
                type: array
                items:
                  type: string

    WizardDetails:
      description: Shipment details and workflow metadata.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/WizardDetails'

    ShipmentIdData:
      description: Shipment id echo after a mutation.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [id]
                properties:
                  id:
                    $ref: '../components/common.yaml#/components/schemas/Id'

    SuccessData:
      description: Simple success flag after a mutation.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean

    ItemData:
      description: Shipment item details after a mutation.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/ItemDetails'

  schemas:
    NamedReference:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: '../components/common.yaml#/components/schemas/Id'
        name:
          type: string
          nullable: true

    NullableNamedReference:
      type: object
      nullable: true
      required: [id, name]
      properties:
        id:
          $ref: '../components/common.yaml#/components/schemas/Id'
        name:
          type: string
          nullable: true

    LocationOption:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: '../components/common.yaml#/components/schemas/Id'
        name:
          type: string
          nullable: true
        locationType:
          type: string
          nullable: true

    ShipmentDetailsRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
        shipmentTypeId:
          type: string
          nullable: true
        originId:
          type: string
          nullable: true
        destinationId:
          type: string
          nullable: true
        expectedShippingDate:
          type: string
          nullable: true
          description: Format yyyy-MM-dd.
        expectedDeliveryDate:
          type: string
          nullable: true
          description: Format yyyy-MM-dd.

    WizardDetails:
      type: object
      required: [id, name, shipmentItemCount]
      properties:
        id:
          $ref: '../components/common.yaml#/components/schemas/Id'
        name:
          type: string
          nullable: true
        shipmentNumber:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        hasShipped:
          type: boolean
        shipmentType:
          $ref: '#/components/schemas/NullableNamedReference'
        origin:
          type: object
          nullable: true
          properties:
            id:
              $ref: '../components/common.yaml#/components/schemas/Id'
            name:
              type: string
              nullable: true
            isWarehouse:
              type: boolean
        destination:
          $ref: '#/components/schemas/NullableNamedReference'
        expectedShippingDate:
          type: string
          nullable: true
        expectedDeliveryDate:
          type: string
          nullable: true
        actualShippingDate:
          type: string
          nullable: true
        carrier:
          $ref: '#/components/schemas/PersonReference'
        recipient:
          $ref: '#/components/schemas/PersonReference'
        shipper:
          $ref: '#/components/schemas/NullableNamedReference'
        trackingNumber:
          type: string
          nullable: true
        statedValue:
          type: number
          nullable: true
        totalValue:
          type: number
          nullable: true
        additionalInformation:
          type: string
          nullable: true
        referenceNumbers:
          type: array
          items:
            type: object
            properties:
              id:
                $ref: '../components/common.yaml#/components/schemas/Id'
              identifier:
                type: string
                nullable: true
              referenceNumberType:
                $ref: '#/components/schemas/NullableNamedReference'
        shipmentItemCount:
          type: integer
        itemRecipients:
          type: array
          items:
            $ref: '#/components/schemas/PersonReference'
        workflow:
          type: object
          nullable: true
          properties:
            id:
              $ref: '../components/common.yaml#/components/schemas/Id'
            name:
              type: string
              nullable: true
            excludedFields:
              type: array
              items:
                type: string
            referenceNumberTypes:
              type: array
              items:
                $ref: '#/components/schemas/NamedReference'

    ShipmentListRow:
      type: object
      required: [id, shipmentNumber, shipmentItemCount]
      properties:
        id:
          $ref: '../components/common.yaml#/components/schemas/Id'
        shipmentNumber:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        shipmentType:
          type: string
          nullable: true
        origin:
          type: string
          nullable: true
        destination:
          type: string
          nullable: true
        shipmentItemCount:
          type: integer
        hasShipped:
          type: boolean
        wasReceived:
          type: boolean
        expectedShippingDate:
          type: string
          nullable: true
        actualShippingDate:
          type: string
          nullable: true
        expectedDeliveryDate:
          type: string
          nullable: true
        actualDeliveryDate:
          type: string
          nullable: true
        lastUpdated:
          type: string
          nullable: true
        requisitionId:
          type: string
          nullable: true

    ShowItemDetails:
      allOf:
        - $ref: '#/components/schemas/ItemDetails'
        - type: object
          properties:
            quantityReceived:
              type: integer
              nullable: true
            quantityCanceled:
              type: integer
              nullable: true
            isFullyReceived:
              type: boolean
            lotNumber:
              type: string
              nullable: true
            expirationDate:
              type: string
              nullable: true

    ReceiptDetails:
      type: object
      nullable: true
      required: [id, receiptItems]
      properties:
        id:
          $ref: '../components/common.yaml#/components/schemas/Id'
        receiptStatusCode:
          type: string
          nullable: true
        actualDeliveryDate:
          type: string
          nullable: true
        expectedDeliveryDate:
          type: string
          nullable: true
        recipient:
          $ref: '#/components/schemas/NullableNamedReference'
        receiptItems:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id:
                $ref: '../components/common.yaml#/components/schemas/Id'
              shipmentItemId:
                type: string
                nullable: true
              container:
                type: string
                nullable: true
              product:
                type: object
                nullable: true
              lotNumber:
                type: string
                nullable: true
              expirationDate:
                type: string
                nullable: true
              quantityShipped:
                type: integer
                nullable: true
              quantityReceived:
                type: integer
                nullable: true
              binLocation:
                $ref: '#/components/schemas/NullableNamedReference'
              comment:
                type: string
                nullable: true
              isSplitAllowed:
                type: boolean
              isDeleteAllowed:
                type: boolean

    PersonReference:
      type: object
      nullable: true
      required: [id, name]
      properties:
        id:
          $ref: '../components/common.yaml#/components/schemas/Id'
        name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true

    ContainerDetails:
      type: object
      required: [id, name, shipmentItems, childContainers]
      properties:
        id:
          $ref: '../components/common.yaml#/components/schemas/Id'
        name:
          type: string
          nullable: true
        sortOrder:
          type: integer
          nullable: true
        containerType:
          $ref: '#/components/schemas/NullableNamedReference'
        itemCount:
          type: integer
        shipmentItems:
          type: array
          items:
            $ref: '#/components/schemas/ItemDetails'
        childContainers:
          type: array
          items:
            type: object
            properties:
              id:
                $ref: '../components/common.yaml#/components/schemas/Id'
              name:
                type: string
                nullable: true
              containerType:
                $ref: '#/components/schemas/NullableNamedReference'
              itemCount:
                type: integer
              shipmentItems:
                type: array
                items:
                  $ref: '#/components/schemas/ItemDetails'

    ItemDetails:
      type: object
      required: [id, quantity]
      properties:
        id:
          $ref: '../components/common.yaml#/components/schemas/Id'
        quantity:
          type: integer
        product:
          type: object
          nullable: true
          properties:
            id:
              $ref: '../components/common.yaml#/components/schemas/Id'
            productCode:
              type: string
              nullable: true
            name:
              type: string
              nullable: true
            unitOfMeasure:
              type: string
              nullable: true
        inventoryItem:
          type: object
          nullable: true
          properties:
            id:
              $ref: '../components/common.yaml#/components/schemas/Id'
            lotNumber:
              type: string
              nullable: true
            expirationDate:
              type: string
              nullable: true
        binLocation:
          $ref: '#/components/schemas/NullableNamedReference'
        container:
          $ref: '#/components/schemas/NullableNamedReference'
        recipient:
          $ref: '#/components/schemas/PersonReference'
    PrintLocation:
      type: object
      nullable: true
      properties:
        id:
          $ref: '../components/common.yaml#/components/schemas/Id'
        name:
          type: string
          nullable: true
        address:
          type: object
          nullable: true
          properties:
            address:
              type: string
              nullable: true
            address2:
              type: string
              nullable: true
            city:
              type: string
              nullable: true
            stateOrProvince:
              type: string
              nullable: true
            postalCode:
              type: string
              nullable: true
            country:
              type: string
              nullable: true
    OutboundReturnPrintData:
      type: object
      required: [id, shipmentNumber, shipmentItems]
      properties:
        id:
          $ref: '../components/common.yaml#/components/schemas/Id'
        shipmentNumber:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        origin:
          $ref: '#/components/schemas/PrintLocation'
        destination:
          $ref: '#/components/schemas/PrintLocation'
        expectedShippingDate:
          type: string
          nullable: true
        receivedDate:
          type: string
          nullable: true
        referenceNumber:
          type: string
          nullable: true
        driverName:
          type: string
          nullable: true
        additionalInformation:
          type: string
          nullable: true
        shipmentItems:
          type: array
          items:
            type: object
            required: [id, receiptItems]
            properties:
              id:
                $ref: '../components/common.yaml#/components/schemas/Id'
              productId:
                type: string
                nullable: true
              productCode:
                type: string
                nullable: true
              productName:
                type: string
                nullable: true
              lotNumber:
                type: string
                nullable: true
              expirationDate:
                type: string
                nullable: true
              quantity:
                type: integer
                nullable: true
              receiptItems:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      $ref: '../components/common.yaml#/components/schemas/Id'
                    productId:
                      type: string
                      nullable: true
                    productCode:
                      type: string
                      nullable: true
                    productName:
                      type: string
                      nullable: true
                    lotNumber:
                      type: string
                      nullable: true
                    expirationDate:
                      type: string
                      nullable: true
                    quantityReceived:
                      type: integer
                      nullable: true
                    comment:
                      type: string
                      nullable: true
    GoodsReceiptNotePrintData:
      type: object
      required: [id, shipmentNumber, receipts, shipmentItems]
      properties:
        id:
          $ref: '../components/common.yaml#/components/schemas/Id'
        shipmentNumber:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        origin:
          $ref: '#/components/schemas/PrintLocation'
        destination:
          $ref: '#/components/schemas/PrintLocation'
        actualShippingDate:
          type: string
          nullable: true
        lastReceiptDate:
          type: string
          nullable: true
        receipts:
          type: array
          items:
            type: object
            properties:
              id:
                $ref: '../components/common.yaml#/components/schemas/Id'
              receiptNumber:
                type: string
                nullable: true
        shipmentItems:
          type: array
          items:
            type: object
            required: [id, receiptItems]
            properties:
              id:
                $ref: '../components/common.yaml#/components/schemas/Id'
              productCode:
                type: string
                nullable: true
              productName:
                type: string
                nullable: true
              lotNumber:
                type: string
                nullable: true
              expirationDate:
                type: string
                nullable: true
              unitOfMeasure:
                type: string
                nullable: true
              quantityShipped:
                type: integer
                nullable: true
              hasSplit:
                type: boolean
              receiptItems:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      $ref: '../components/common.yaml#/components/schemas/Id'
                    receiptId:
                      type: string
                      nullable: true
                    lotNumber:
                      type: string
                      nullable: true
                    expirationDate:
                      type: string
                      nullable: true
                    quantityShipped:
                      type: integer
                      nullable: true
                    quantityReceived:
                      type: integer
                      nullable: true
                    comment:
                      type: string
                      nullable: true
                    isSplitItem:
                      type: boolean
                      nullable: true
