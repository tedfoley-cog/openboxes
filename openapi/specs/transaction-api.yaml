openapi: 3.0.3
info:
  title: OpenBoxes - TransactionApiController
  description: >
    Transaction read/edit endpoints handled by
    org.pih.warehouse.api.TransactionApiController, routed via the explicit
    "/api/transactions" (GET -> list),
    "/api/transactions/daily" (GET -> listDaily), "/api/transactions/types"
    (GET -> transactionTypes), "/api/transactions/locationOptions"
    (GET -> locationOptions), "/api/transactions/$id" (GET -> read,
    PUT -> update, DELETE -> delete) and
    "/api/transactions/$id/entries/$entryId" (DELETE -> deleteEntry)
    mappings, plus the generic "/api/${resource}s" mapping
    ("/api/transactions", POST -> create) backing the React
    record-transaction screen migrated from the legacy
    inventory/createTransaction GSP. Added for the React migration of the
    inventory/listDailyTransactions, inventory/editTransaction,
    inventory/listTransactions and inventory/showTransaction screens.
  version: 0.1.0
servers:
  - url: http://localhost:8080/openboxes
    description: Local Docker baseline (docs/migration/RUNNING_LOCALLY.md)
security:
  - cookieAuth: []
paths:
  /api/transactions:
    get:
      operationId: listTransactions
      summary: Paginated transactions for a facility's inventory
      description: >
        Mirrors the legacy inventory/listTransactions screen - transactions
        scoped to the facility's inventory, filtered by transaction number
        (contains, case-insensitive), transaction type and transaction date
        range, sorted by dateCreated descending by default. Dates are ISO
        yyyy-MM-dd only. Defaults to the session warehouse when facilityId
        is not given.
      parameters:
        - name: facilityId
          in: query
          required: false
          schema:
            type: string
          description: Facility (location) id. Defaults to the session warehouse.
        - name: transactionNumber
          in: query
          required: false
          schema:
            type: string
        - name: transactionTypeId
          in: query
          required: false
          schema:
            type: string
        - name: transactionDateFrom
          in: query
          required: false
          schema:
            type: string
          description: yyyy-MM-dd
        - name: transactionDateTo
          in: query
          required: false
          schema:
            type: string
          description: yyyy-MM-dd
        - name: max
          in: query
          required: false
          schema:
            type: integer
          description: Page size, capped at 100. Defaults to 10 (legacy default).
        - name: offset
          in: query
          required: false
          schema:
            type: integer
        - name: sort
          in: query
          required: false
          schema:
            type: string
          description: Sort property. Defaults to dateCreated.
        - name: order
          in: query
          required: false
          schema:
            type: string
          description: asc or desc. Defaults to desc.
      responses:
        '200':
          description: Page of transactions with the unpaged total count.
          content:
            application/json:
              schema:
                type: object
                required: [data, totalCount]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TransactionSummary'
                  totalCount:
                    type: integer
        '400':
          description: No location - not signed in and no facilityId given.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorMessage:
                    type: string
    post:
      operationId: createTransaction
      summary: Create an inventory transaction with one or more entries
      description: >
        Creates a Transaction of the given type. Adjustment types
        (Adjustment credit/debit) get an ADJUST_INVENTORY transaction
        source; Transfer Out accepts destinationId and Transfer In accepts
        sourceId. Debit entries are validated against the on-hand quantity.
        Parity quirks - missing/invalid transactionTypeId or empty entries
        raise IllegalArgumentException (500); validation failures raise
        ValidationException (400).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transactionTypeId, entries]
              properties:
                transactionTypeId:
                  type: string
                  description: TransactionType id (e.g. "2" Consumed, "10" Adjustment debit).
                locationId:
                  type: string
                  nullable: true
                  description: Defaults to the session warehouse.
                transactionDate:
                  type: string
                  nullable: true
                  description: 'Format MM/dd/yyyy HH:mm; defaults to now.'
                comment:
                  type: string
                  nullable: true
                sourceId:
                  type: string
                  nullable: true
                  description: Source location id (Transfer In only).
                destinationId:
                  type: string
                  nullable: true
                  description: Destination location id (Transfer Out only).
                entries:
                  type: array
                  items:
                    type: object
                    properties:
                      inventoryItemId:
                        type: string
                        nullable: true
                      productId:
                        type: string
                        nullable: true
                        description: >
                          Used with lotNumber/expirationDate when
                          inventoryItemId is not given.
                      lotNumber:
                        type: string
                        nullable: true
                      expirationDate:
                        type: string
                        nullable: true
                        description: 'Format MM/dd/yyyy.'
                      binLocationId:
                        type: string
                        nullable: true
                      quantity:
                        type: integer
                      reasonCode:
                        type: string
                        nullable: true
                      comment:
                        type: string
                        nullable: true
      responses:
        '200':
          description: Transaction created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id]
                    properties:
                      id:
                        $ref: '../components/common.yaml#/components/schemas/Id'
                      transactionNumber:
                        type: string
                        nullable: true
                      transactionType:
                        type: object
                        properties:
                          id:
                            type: string
                            nullable: true
                          name:
                            type: string
                            nullable: true
                      productIds:
                        type: array
                        items:
                          type: string
        '400':
          $ref: '../components/common.yaml#/components/responses/ValidationError'
        '500':
          $ref: '../components/common.yaml#/components/responses/ServerError'
  /api/transactions/daily:
    get:
      operationId: listDailyTransactions
      summary: All transaction dates with counts plus the selected day's transactions
      description: >
        Groups every transaction (across all locations, matching the legacy
        listDailyTransactions screen) by calendar day. Returns the date list
        (newest first) and the transactions whose transactionDate falls on
        the selected day. Parity note - the legacy screen matched
        transactions by exact timestamp equality with midnight, which showed
        an empty list for most days; this endpoint deliberately matches the
        whole selected day.
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
          description: Selected day as yyyy-MM-dd. Defaults to today.
      responses:
        '200':
          description: Dates with counts and the selected day's transactions.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [dateSelected, dates, transactions]
                    properties:
                      dateSelected:
                        type: string
                      dates:
                        type: array
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                            count:
                              type: integer
                      transactions:
                        type: array
                        items:
                          $ref: '#/components/schemas/Transaction'
  /api/transactions/types:
    get:
      operationId: listTransactionTypes
      summary: All transaction types
      responses:
        '200':
          description: Transaction type options.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                          nullable: true
                        transactionCode:
                          type: string
                          nullable: true
  /api/transactions/locationOptions:
    get:
      operationId: listTransactionLocationOptions
      summary: Source/destination options for the transaction edit screen
      description: >
        Top-level locations (parentLocation is null), matching the options
        the legacy editTransaction screen offered for source/destination.
      responses:
        '200':
          description: Location options sorted by name.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                          nullable: true
  /api/transactions/{id}:
    get:
      operationId: readTransaction
      summary: Transaction details for the edit screen
      description: >
        The transaction with its entries plus inventoryItemsByProduct - all
        inventory items (lot candidates) for each product present in the
        entries, matching the legacy editTransaction model.
      parameters:
        - $ref: '#/components/parameters/transactionId'
      responses:
        '200':
          description: Transaction details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetailResponse'
        '404':
          $ref: '#/components/responses/TransactionNotFound'
    put:
      operationId: updateTransaction
      summary: Update transaction header fields and entries
      description: >
        Updates transactionDate, transactionType, source, destination,
        comment and per-entry inventoryItem/quantity. Only keys present in
        the JSON body are bound. Validation failures raise
        ValidationException (500 via the global error handler).
      parameters:
        - $ref: '#/components/parameters/transactionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                transactionDate:
                  type: string
                  nullable: true
                  description: '"yyyy-MM-dd HH:mm:ss"'
                transactionType:
                  type: object
                  nullable: true
                  properties:
                    id:
                      type: string
                source:
                  type: object
                  nullable: true
                  properties:
                    id:
                      type: string
                destination:
                  type: object
                  nullable: true
                  properties:
                    id:
                      type: string
                comment:
                  type: string
                  nullable: true
                transactionEntries:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      inventoryItem:
                        type: object
                        properties:
                          id:
                            type: string
                      quantity:
                        type: integer
      responses:
        '200':
          description: Updated transaction details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetailResponse'
        '404':
          $ref: '#/components/responses/TransactionNotFound'
        '500':
          $ref: '../components/common.yaml#/components/responses/ServerError'
    delete:
      operationId: deleteTransaction
      summary: Delete a transaction and its entries
      description: >
        Deletes the transaction via InventoryService.deleteTransaction,
        mirroring the legacy inventory/deleteTransaction action. Requires a
        superuser; returns 403 otherwise. Returns 400 when the transaction
        cannot be deleted due to integrity constraints.
      parameters:
        - $ref: '#/components/parameters/transactionId'
      responses:
        '200':
          description: The id of the deleted transaction.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
        '400':
          description: Transaction could not be deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorMessage:
                    type: string
        '403':
          description: Caller is not a superuser.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorMessage:
                    type: string
        '404':
          $ref: '#/components/responses/TransactionNotFound'
  /api/transactions/{id}/entries/{entryId}:
    delete:
      operationId: deleteTransactionEntry
      summary: Delete a single transaction entry
      parameters:
        - $ref: '#/components/parameters/transactionId'
        - name: entryId
          in: path
          required: true
          schema:
            $ref: '../components/common.yaml#/components/schemas/Id'
          description: Transaction entry id.
      responses:
        '200':
          description: Updated transaction details after the delete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetailResponse'
        '404':
          $ref: '#/components/responses/TransactionNotFound'
components:
  securitySchemes:
    cookieAuth:
      $ref: '../components/common.yaml#/components/securitySchemes/cookieAuth'
  parameters:
    transactionId:
      name: id
      in: path
      required: true
      schema:
        $ref: '../components/common.yaml#/components/schemas/Id'
      description: Transaction id.
  responses:
    TransactionNotFound:
      description: No transaction (or entry) with the given id.
      content:
        application/json:
          schema:
            type: object
            properties:
              errorMessage:
                type: string
  schemas:
    TransactionSummary:
      type: object
      description: Lightweight transaction rendering for the list endpoint.
      properties:
        id:
          type: string
        transactionNumber:
          type: string
          nullable: true
        transactionDate:
          type: string
          nullable: true
        dateCreated:
          type: string
          nullable: true
        transactionType:
          type: object
          nullable: true
          properties:
            id:
              type: string
              nullable: true
            name:
              type: string
              nullable: true
        inventory:
          type: object
          nullable: true
          properties:
            id:
              type: string
              nullable: true
            name:
              type: string
              nullable: true
        source:
          type: object
          nullable: true
          properties:
            id:
              type: string
            name:
              type: string
              nullable: true
        destination:
          type: object
          nullable: true
          properties:
            id:
              type: string
            name:
              type: string
              nullable: true
        createdBy:
          type: object
          nullable: true
          properties:
            id:
              type: string
            name:
              type: string
              nullable: true
        entryCount:
          type: integer
    Transaction:
      type: object
      description: Transaction rendering shared by listDaily and read.
      properties:
        id:
          type: string
        transactionNumber:
          type: string
          nullable: true
        transactionDate:
          type: string
          nullable: true
        dateCreated:
          type: string
          nullable: true
        transactionType:
          type: object
          nullable: true
          properties:
            id:
              type: string
              nullable: true
            name:
              type: string
              nullable: true
        source:
          type: object
          nullable: true
          properties:
            id:
              type: string
            name:
              type: string
              nullable: true
        destination:
          type: object
          nullable: true
          properties:
            id:
              type: string
            name:
              type: string
              nullable: true
        comment:
          type: string
          nullable: true
        transactionEntries:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              quantity:
                type: integer
                nullable: true
              binLocation:
                type: object
                nullable: true
                properties:
                  id:
                    type: string
                  name:
                    type: string
                    nullable: true
              inventoryItem:
                type: object
                properties:
                  id:
                    type: string
                    nullable: true
                  lotNumber:
                    type: string
                    nullable: true
                  expirationDate:
                    type: string
                    nullable: true
              product:
                type: object
                properties:
                  id:
                    type: string
                    nullable: true
                  productCode:
                    type: string
                    nullable: true
                  name:
                    type: string
                    nullable: true
    TransactionDetailResponse:
      type: object
      required: [data]
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/Transaction'
            - type: object
              properties:
                confirmed:
                  type: boolean
                  nullable: true
                inventory:
                  type: object
                  nullable: true
                  properties:
                    id:
                      type: string
                      nullable: true
                    name:
                      type: string
                      nullable: true
                createdBy:
                  type: object
                  nullable: true
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                      nullable: true
                updatedBy:
                  type: object
                  nullable: true
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                      nullable: true
                lastUpdated:
                  type: string
                  nullable: true
                outgoingShipment:
                  type: object
                  nullable: true
                  properties:
                    id:
                      type: string
                    shipmentNumber:
                      type: string
                      nullable: true
                incomingShipment:
                  type: object
                  nullable: true
                  properties:
                    id:
                      type: string
                    shipmentNumber:
                      type: string
                      nullable: true
                receipt:
                  type: object
                  nullable: true
                  properties:
                    id:
                      type: string
                    receiptNumber:
                      type: string
                      nullable: true
                order:
                  type: object
                  nullable: true
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                      nullable: true
                localTransfer:
                  type: object
                  nullable: true
                  properties:
                    id:
                      type: string
                    sourceTransaction:
                      type: object
                      nullable: true
                      properties:
                        id:
                          type: string
                        transactionNumber:
                          type: string
                          nullable: true
                    destinationTransaction:
                      type: object
                      nullable: true
                      properties:
                        id:
                          type: string
                        transactionNumber:
                          type: string
                          nullable: true
                inventoryItemsByProduct:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        lotNumber:
                          type: string
                          nullable: true
                        expirationDate:
                          type: string
                          nullable: true
